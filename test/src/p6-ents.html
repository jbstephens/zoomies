<script>
/* ═══════════════════ ZOOMIES! — p6  entities ═══════════════════════════
   Every enemy is BONK-NOT-DIE (design §4): defeated = dizzy stars + a pop
   of 3–5 kibble.  Nothing bleeds, nothing dies; dogs end up sitting with
   their tongue out and, in Rex's case, become friends.

   Meshes are built once at level load and disposed on level clear.  The
   only things that move every frame are transforms.  Projectiles are a
   fixed pool of pre-built meshes, so a toaster gauntlet never allocates. */

const ENTS = [];          // enemies + hazards, all level-owned
const PICKS = [];         // treats + golden mice (kibble is instanced)
const KIBS = [];          // kibble records, drawn through ONE InstancedMesh
let kibMesh = null;

/* ── shared little builders ────────────────────────────────────────── */
function dizzyStars(x, y, z, n) {
  for (let i = 0; i < (n || 5); i++) {
    const a = i / (n || 5) * TAU;
    spark(x + Math.cos(a) * 0.3, y + 0.1, z + Math.sin(a) * 0.3,
      Math.cos(a) * 1.3, 2.4 + Math.random(), Math.sin(a) * 1.3,
      0.75, 0.30, 0.02, 1.0, 0.92, 0.45, 4);
  }
}
/* a burst of packing peanuts — DELIVERY DRONE 9000's boxes, and the confetti
   pickle slices THE CUCUMBER KING shatters into (same pooled bits, different
   colours: the whole VFX layer stays at four draw calls) */
function peanutBurst(x, y, z, n, cr, cg, cb) {
  const N = n || 16;
  for (let i = 0; i < N; i++) {
    const a = Math.random() * TAU, sp = 2.2 + Math.random() * 3.4;
    bit(x, y, z, Math.cos(a) * sp, 3.4 + Math.random() * 3.6, Math.sin(a) * sp,
      1.1 + Math.random() * 0.5, 0.15 + Math.random() * 0.07,
      cr == null ? 0.98 : cr, cg == null ? 0.95 : cg, cb == null ? 0.86 : cb, 15);
  }
  for (let i = 0; i < 6; i++)
    spark(x, y + 0.2, z, (Math.random() - 0.5) * 3, Math.random() * 2.4, (Math.random() - 0.5) * 3,
      0.42, 0.22, 0.02, 1.0, 0.96, 0.84, 6);
  sfxPeanuts();
}
function kibblePop(x, y, z, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = 1.4 + Math.random() * 2.2;
    addKibble(x + Math.cos(a) * 0.2, y + 0.3, z + Math.sin(a) * 0.2,
      Math.cos(a) * sp, 4.2 + Math.random() * 2.4, Math.sin(a) * sp);
  }
}

/* ── kibble: the coin.  ONE instanced draw call for the whole level ──── */
function addKibble(x, y, z, vx, vy, vz) {
  KIBS.push({ x, y, z, vx: vx || 0, vy: vy || 0, vz: vz || 0,
    on: true, free: !!vx || !!vy || !!vz, t: Math.random() * TAU, rest: 0, y0: y });
}
function buildKibbleMesh(cap) {
  if (kibMesh) { scene.remove(kibMesh); kibMesh.geometry.dispose(); kibMesh.material.dispose(); kibMesh = null; }
  const n = Math.max(16, cap);
  const g = vcPart(new THREE.OctahedronGeometry(0.115, 0), 0xffcc4d);
  const m = new THREE.InstancedMesh(g, new THREE.MeshBasicMaterial({ vertexColors: true }), n);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  m.count = 0;
  scene.add(m);
  kibMesh = m;
}
const _kq = new THREE.Quaternion(), _ky = new THREE.Vector3(0, 1, 0);
function drawKibble(catZ) {
  if (!kibMesh) return 0;
  let n = 0;
  const cap = kibMesh.instanceMatrix.count;
  for (let i = 0; i < KIBS.length && n < cap; i++) {
    const k = KIBS[i];
    if (!k.on) continue;
    const dz = k.z - catZ;
    if (dz < -14 || dz > 74) continue;
    if (TW.on) { twMap(k.z, k.x, k.y + Math.sin(k.t) * 0.055, _tw); _pv.set(_tw[0], _tw[1], _tw[2]); }
    else _pv.set(k.x, k.y + Math.sin(k.t) * 0.055, k.z);
    _kq.setFromAxisAngle(_ky, k.t * 1.6);
    _sc.set(1, 1, 1);
    _m4.compose(_pv, _kq, _sc);
    kibMesh.setMatrixAt(n, _m4);
    n++;
  }
  kibMesh.count = n;
  kibMesh.instanceMatrix.needsUpdate = true;
  return n;
}

function addPick(kind, x, y, z) {
  let m;
  if (kind === 'fish') m = buildFish();
  else if (kind === 'milk') m = buildSaucer();
  else m = buildMouse();
  twPos(m, x, y, z);
  scene.add(m);
  PICKS.push({ k: kind, x, y, z, y0: y, on: true, t: Math.random() * TAU, g: m });
}

/* ── checkpoint arch + food bowl ───────────────────────────────────── */
function buildCheckpoint(x, y, z) {
  const g = new THREE.Group();
  const post = (sx) => vcMesh([
    vcCyl(0.10, 0.13, 1.9, 7, 0xd8b06a).translate(0, 0.95, 0),
    vcSph(0.13, 6, 4, 0xffd75e).translate(0, 1.92, 0),
  ]);
  const a = post(-1), b = post(1);
  a.position.set(-1.7, 0, 0); b.position.set(1.7, 0, 0);
  const bar = vcMesh([
    vcBox(3.6, 0.16, 0.20, 0xd8b06a).translate(0, 1.95, 0),
    vcBox(1.5, 0.42, 0.06, 0xffd75e).translate(0, 1.66, 0.02),
  ]);
  const bowl = vcMesh([
    vcCyl(0.30, 0.22, 0.16, 10, 0xe86a5a).translate(0, 0.08, 0),
    vcCyl(0.26, 0.26, 0.03, 10, 0xc4a05a).translate(0, 0.155, 0),
  ]);
  bowl.position.set(0, 0, 0.45);
  g.add(a, b, bar, bowl);
  twFace(g, x, y, z, 0);
  scene.add(g);
  return g;
}

/* the produce-aisle melon on patrol: a big friendly striped bowling ball */
function mMelon() {
  /* Stripes are thin DISCS a hair wider than the skin, not slabs: a slab
     big enough to show at the equator swallows the whole melon at the
     poles (it read as a green folder in the first shot pass), and one that
     exactly matches the skin z-fights along the graze line. */
  const p = [vcSph(0.42, 10, 8, 0x4f9a3a).scale(1, 0.92, 1.06)];
  for (let i = 0; i < 3; i++)
    p.push(vcCyl(0.432, 0.432, 0.10, 12, 0x9ad06a).rotateX(Math.PI / 2).rotateY(i * 1.05));
  p.push(vcCyl(0.035, 0.05, 0.12, 5, 0x6f8f4a).translate(0, 0.40, 0));
  return vcMesh(p);
}

          vcSph(0.26, 7, 5, 0x3a4450).scale(1, 1.15, 1),
          vcBox(0.16, 0.14, 0.16, 0x2a323c).translate(0, 0.24, 0),
          vcBox(0.30, 0.03, 0.30, 0x4a5460).translate(0, -0.12, 0),

      }
      m.visible = false;
      scene.add(m);
      PROJ.push({ k, on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, own: 0, src: null, t: 0, g: m, spin: 0 });

function fireProj(kind, x, y, z, vx, vy, vz, src) {

    p.on = true; p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz;

<script>
/* ═══════════════════ ZOOMIES! — p6b  enemy spawn + AI ══════════════════
   One record shape for every enemy so the sim's collision / bonk / cull
   loops stay flat and allocation-free.  `hit` is the bonk verb set: which
   of the cat's four attacks (and the roll / zoomies contact) can pop it.  */

const HAZARD_R = 0.62;          // generic body radius for cat-vs-enemy touch

function addEnt(k, x, y, z, o) {
  o = o || {};
  const e = {
    k, x, y, z, y0: y, x0: x, z0: z,
    alive: true, dead: false, t: Math.random() * 3, st: 0, stT: 0,
    vx: 0, vy: 0, vz: 0, face: o.face != null ? o.face : Math.PI,
    r: o.r || HAZARD_R, h: o.h || 0.7, hurt: o.hurt !== false,
    bonk: o.bonk !== false, mesm: 0, mesmT: 0, shake: 0,
    rng: o.rng || 3.0, per: o.per || 2.0, ph: o.ph || 0, amp: o.amp || 0,
    g: null, g2: null, flash: 0, tip: 0, spinT: 0, dizzy: 0, fired: 0,
    boss: false, hp: o.hp || 1, sit: 0, launch: o.launch || 0, lane: o.lane || 0,
    /* a RESKIN, never a new AI (LEVELS2 §B): `look` picks the mesh and the
       kind keeps its already-verified behaviour */
    look: o.look || '',
  };
  if (k === 'vac') { e.g = o.look === 'ghost' ? mVacGhost(1) : mVac(1); e.r = 0.52; e.h = 0.42; }
  else if (k === 'spray') { e.g = mSpray(); e.r = 0.30; e.h = 0.58; }
  else if (k === 'toast') { e.g = mToaster(); e.r = 0.40; e.h = 0.48; }
  else if (k === 'yarn') { e.g = mYarn(); e.r = 0.32; e.h = 0.6; }
  else if (k === 'cuke') {
    e.g = mCucumber(); e.r = 0.44; e.h = 0.3; e.hurt = false; e.bonk = false;
    /* THE CUCUMBER KING's minions are LAUNCH PADS 12 m below a crown — at the
       house-cat size they read as green pills you cannot find.  The trigger
       radius grows with the art so the hitbox never lies. */
    if (o.look === 'big') { e.g.scale.setScalar(1.5); e.r = 0.64; e.h = 0.42; }
  }
  else if (k === 'sprk') {
    e.g = o.look === 'can' ? mWateringCan() : o.look === 'star' ? mStarSprinkler() : mSprinkler();
    e.r = 0.28; e.h = 0.5; e.hurt = false; e.bonk = false;
  }
  else if (k === 'dog') { e.g = mDogBody(false); e.g2 = mDogHead(false); e.g2.position.set(0, 0.52, 0.34); e.g.add(e.g2); e.r = 0.44; e.h = 0.75; }
  else if (k === 'crow') { e.g = o.look === 'bee' ? mBee() : mCrow(); e.r = 0.34; e.h = 0.4; }
  /* `flit` — butterflies and air-swimming fish.  Pure joy: they lead the
     kibble trails and can never hurt or be hurt (design §4 charm budget). */
  else if (k === 'flit') {
    e.g = o.look === 'fish' ? mAirFish() : mButterfly();
    /* scaled up on purpose: at 1× they read as litter on the floor rather
       than as creatures in the air (first shot pass, romp 7) */
    e.g.scale.setScalar(o.look === 'fish' ? 1.7 : 2.0);
    e.r = 0.30; e.h = 0.40; e.hurt = false; e.bonk = false;
    e.rng = o.rng || 2.2;
  }
  else if (k === 'gnome') { e.g = mGnome(); e.r = 0.30; e.h = 0.9; e.hurt = false; }
  else if (k === 'pigeon') { e.g = mPigeon(); e.r = 0.22; e.h = 0.3; e.hurt = false; e.bonk = false; }
  else if (k === 'coon') { e.g = mCoon(); e.r = 0.42; e.h = 0.95; }
  else if (k === 'vent') { e.g = mVent(); e.r = 0.5; e.h = 0.55; e.hurt = false; e.bonk = false; }
  else if (k === 'zap') { e.g = mZap(); e.r = 0.7; e.h = 1.2; e.bonk = false; }
  else if (k === 'can') { e.g = mCan(); e.r = 0.24; e.h = 0.42; e.lane = o.lane != null ? o.lane : z; }
  else if (k === 'melon') { e.g = mMelon(); e.r = 0.44; e.h = 0.8; }
  if (e.g) {
    twFace(e.g, x, y, z, e.face);
    if (LOOK && FX.shadow && k !== 'pigeon' && k !== 'vent' && k !== 'zap') e.g.castShadow = true;
    scene.add(e.g);
  }
  /* the zapper's live arc is its own emissive bar so it can blink */
  if (k === 'zap') {
    const arc = vcMesh([vcCyl(0.13, 0.13, 1.20, 8, 0xaaf0ff).rotateZ(Math.PI / 2)],
      new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false }));
    arc.position.set(0, 1.10, 0);

  if (k === 'sprk') {
    const parts = [];
    for (let i = 0; i < 7; i++) {
      const d = 0.6 + i * 0.52;
      /* romp 7's dream sprinkler rains STARS, so the arc takes a warm tint —
         romps 1–3 pass no `look` and keep the exact pale-blue water arc */
      parts.push(vcBox(0.16, 0.16, 0.34, e.look === 'star' ? 0xfff0b0 : 0xa8e4ff)

    }
    const arc = vcMesh(parts, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.72, depthWrite: false }));

}

function killEnt(e, dizzyOnly) {
  if (!e.alive) return;
  e.alive = false;
  e.dizzy = 1;
  dizzyStars(e.x, e.y + e.h + 0.2, e.z, 5);
  kibblePop(e.x, e.y + 0.3, e.z, 3 + (Math.random() * 3 | 0));
  sfxBonk(e.k);
  if (e.k === 'dog') { e.sit = 1; }                    // dogs SIT, never die
  else if (e.k === 'yarn') { e.dead = false; }         // tangled, harmless
  else if (!dizzyOnly) { e.dead = true; }
}

/* ── the update: one flat pass, no allocation ─────────────────────────
   Runs on SIM ticks (fixed dt).  Every enemy is culled by z distance for
   both AI and draw, so a 250 m level costs the same as a 40 m one.      */
function updateEnts(dt) {
  const cz = CAT.z, cx = CAT.x, cy = CAT.y;
  for (let i = 0; i < ENTS.length; i++) {
    const e = ENTS[i];
    const dz = e.z - cz;
    const near = dz > -22 && dz < 62;
    if (e.g) e.g.visible = near && !e.dead;
    if (!near) continue;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;

    /* dizzy settle for bonked-but-present enemies (dogs, tangled yarn) */
    if (!e.alive) {
      if (e.k === 'dog') {
        e.g.rotation.x = smooth(e.g.rotation.x, -0.42, 0.10, dt);
        e.g.position.y = smooth(e.g.position.y, e.y0 - 0.06, 0.10, dt);
        if (e.g2) e.g2.rotation.z = Math.sin(e.t * 9) * 0.10;     // happy pant
      } else if (e.k === 'yarn') {
        e.g.scale.set(smooth(e.g.scale.x, 1.25, 0.08, dt), smooth(e.g.scale.y, 0.35, 0.08, dt), 1.25);
        e.g.position.y = e.y0;
      } else if (e.g) {
        e.g.position.y = smooth(e.g.position.y, e.y0 - 0.1, 0.08, dt);
        e.g.rotation.z = smooth(e.g.rotation.z, 1.3, 0.08, dt);
        e.dizzy -= dt * 0.5;
        if (e.dizzy <= 0) { e.g.visible = false; e.dead = true; }
      }
      continue;
    }

    /* mesmerized by the P2 laser: chase the dot, hurt nobody */
    if (e.mesm > 0) {
      e.mesm -= dt;
      const tx = LASER.x, tz = LASER.z;
      const d = Math.hypot(tx - e.x, tz - e.z) || 1;
      const sp = e.k === 'dog' ? 4.6 : 2.2;
      e.x += (tx - e.x) / d * sp * dt;
      e.z += (tz - e.z) / d * sp * dt;
      e.face = Math.atan2(tx - e.x, tz - e.z);
      if (e.g) twFace(e.g, e.x, e.y, e.z, e.face);
      if (e.k === 'dog' && e.g2) e.g2.rotation.x = Math.sin(e.t * 16) * 0.12;
      continue;
    }

    switch (e.k) {
      case 'vac': {
        /* patrol → telegraph (rattle + red glow) → charge → crash → recover */
        if (e.st === 0) {
          e.x = e.x0 + Math.sin(e.t * 1.5 / Math.max(0.4, e.rng) * 2) * e.rng;
          e.face = Math.cos(e.t * 1.5 / Math.max(0.4, e.rng) * 2) > 0 ? Math.PI / 2 : -Math.PI / 2;
          if (Math.abs(dz) < 9 && dz > -2 && Math.abs(e.x - cx) < 6.5) { e.st = 1; e.stT = 0.95; sfxVacRev(); }
        } else if (e.st === 1) {
          e.stT -= dt; e.shake = 1;
          e.face = Math.atan2(cx - e.x, cz - e.z);
          if (e.stT <= 0) {
            e.st = 2; e.stT = 1.15; e.shake = 0;
            const d = Math.hypot(cx - e.x, cz - e.z) || 1;
            e.vx = (cx - e.x) / d * 9.5; e.vz = (cz - e.z) / d * 9.5;
          }
        } else if (e.st === 2) {
          e.stT -= dt;
          e.x += e.vx * dt; e.z += e.vz * dt;
          if (Math.abs(e.x - e.x0) > e.rng + 3.4 || e.stT <= 0) { e.st = 3; e.stT = 0.85; sfxThud(0.5); }
        } else {
          e.stT -= dt;
          if (e.stT <= 0) { e.st = 0; e.x0 = e.x; }
        }
        if (e.g) {
          twFace(e.g, e.x + (e.shake ? (Math.random() - 0.5) * 0.06 : 0), e.y, e.z, e.face);
          e.g.rotation.z = e.st === 2 ? Math.sin(e.t * 40) * 0.05 : 0;
        }
        break;
      }
      case 'spray': {
        if (Math.abs(dz) < 19 && dz > -3) {
          e.face = Math.atan2(cx - e.x, cz - e.z);
          e.stT -= dt;
          if (e.stT <= 0) {
            e.stT = 2.1;
            const d = Math.hypot(cx - e.x, cz - e.z) || 1;
            const sp = 11;
            fireProj('water', e.x + (cx - e.x) / d * 0.4, e.y + 0.52, e.z + (cz - e.z) / d * 0.4,
              (cx - e.x) / d * sp, 3.2, (cz - e.z) / d * sp, e);
            sfxSpray();
          }
        }
        if (e.g) { e.g.rotation.y = twYaw(e.z, e.face); e.g.position.y = e.y + Math.sin(e.t * 3) * 0.012; }
        break;
      }
      case 'toast': {
        e.stT -= dt;
        if (e.stT <= 0 && Math.abs(dz) < 24) {
          e.stT = 1.9;
          for (let k = 0; k < 2; k++) {
            fireProj('toast', e.x + (k ? 0.14 : -0.14), e.y + 0.48, e.z,
              (Math.random() - 0.5) * 1.6, 9.4 + Math.random() * 1.2, -2.2 - Math.random() * 3.2, e);
          }
          sfxToastPop();
          e.flash = 0.22;
        }
        if (e.g) e.g.position.y = e.y + (e.flash > 0 ? 0.05 : 0);
        break;
      }
      case 'yarn': {
        /* rolls toward the cat down the corridor */
        const d = Math.hypot(cx - e.x, cz - e.z) || 1;
        if (d < 22) {
          e.vx = smooth(e.vx, (cx - e.x) / d * 3.4, 0.05, dt);
          e.vz = smooth(e.vz, (cz - e.z) / d * 3.4, 0.05, dt);
          e.x += e.vx * dt; e.z += e.vz * dt;
          if (e.g) {
            twPos(e.g, e.x, e.y, e.z);
            e.g.rotation.x += e.vz * dt / 0.30;
            e.g.rotation.z -= e.vx * dt / 0.30;
          }
        }
        break;
      }
      case 'cuke': {
        if (e.g) e.g.position.y = e.y;
        break;
      }
      case 'sprk': {
        e.face += dt * (e.per > 0 ? TAU / e.per : 1.4);
        if (e.g) e.g.rotation.y = twYaw(e.z, e.face);
        break;
      }
      /* — the market set — */
      case 'can': {
        /* knocked off a shelf and rolling down the aisle at the cat; when it
           has rolled past him it goes back up the aisle and does it again */
        if (dz < 26) {
          e.z -= 5.2 * dt;
          e.x += Math.sin(e.t * 1.7) * 0.5 * dt;
          if (e.z < cz - 9 || e.z < e.lane - 34) { e.z = e.lane; e.x = e.x0; }
          if (e.g) {
            twPos(e.g, e.x, e.y, e.z);
            e.g.rotation.x -= 5.2 * dt / 0.20;
            e.g.rotation.y = twYaw(e.z, Math.PI / 2);
          }
        }
        break;
      }
      /* — the L5/L7 charm layer: butterflies and air-swimming fish — */
      case 'flit': {
        /* a little lissajous around the spawn, so the kibble trail it leads
           reads as a path something actually FLEW.  No hazard, no bonk. */
        const ph = e.ph;
        e.x = e.x0 + Math.sin(e.t * 0.9 + ph) * e.rng;
        e.y = e.y0 + Math.sin(e.t * 1.7 + ph * 1.3) * 0.42;
        e.z = e.z0 + Math.cos(e.t * 0.7 + ph) * 1.7;
        if (e.g) {
          twFace(e.g, e.x, e.y, e.z,
            Math.atan2(Math.cos(e.t * 0.9 + ph) * e.rng, -Math.sin(e.t * 0.7 + ph) * 1.7));
          e.g.rotation.z = Math.sin(e.t * (e.look === 'fish' ? 7 : 17)) * (e.look === 'fish' ? 0.18 : 0.55);
        }
        break;
      }
      case 'melon': {
        /* patrols its lane, slow and heavy, and turns at the ends */
        e.x = e.x0 + Math.sin(e.t * 1.1 / Math.max(0.5, e.rng)) * e.rng;
        const vx = Math.cos(e.t * 1.1 / Math.max(0.5, e.rng)) * e.rng;
        if (e.g) {
          twPos(e.g, e.x, e.y + 0.42, e.z);
          e.g.rotation.z -= vx * dt * 2.4;
          e.g.rotation.y = twYaw(e.z, 0);
        }
        break;
      }
      case 'dog': {
        if (e.st === 0) {
          /* idle bark + a little hop */
          if (Math.abs(dz) < 11 && dz > -4) { e.st = 1; e.stT = 0.45; sfxBark(1); }
          if (e.g) { e.g.position.y = e.y + Math.abs(Math.sin(e.t * 3)) * 0.03; e.g.rotation.y = smooth(e.g.rotation.y, twYaw(e.z, Math.atan2(cx - e.x, cz - e.z)), 0.08, dt); }
        } else if (e.st === 1) {
          e.stT -= dt;
          e.face = Math.atan2(cx - e.x, cz - e.z);
          if (e.g) { e.g.rotation.y = twYaw(e.z, e.face); e.g.position.y = e.y - 0.05; }
          if (e.stT <= 0) { e.st = 2; e.stT = 1.25; sfxBark(1.15); }
        } else if (e.st === 2) {
          e.stT -= dt;
          const d = Math.hypot(cx - e.x, cz - e.z) || 1;
          e.x += (cx - e.x) / d * 6.2 * dt;
          e.z += (cz - e.z) / d * 6.2 * dt;
          e.face = Math.atan2(cx - e.x, cz - e.z);
          if (e.g) {
            twFace(e.g, e.x, e.y + Math.abs(Math.sin(e.t * 22)) * 0.09, e.z, e.face);
            if (e.g2) e.g2.rotation.x = Math.sin(e.t * 22) * 0.16;
          }
          if (e.stT <= 0) { e.st = 3; e.stT = 1.0; }
        } else {
          e.stT -= dt;
          if (e.g) e.g.position.y = smooth(e.g.position.y, e.y, 0.08, dt);
          if (e.stT <= 0) e.st = 0;
        }
        break;
      }
      case 'crow': {
        if (e.st === 0) {
          e.y = e.y0 + Math.sin(e.t * 1.6) * 0.05;
          if (Math.abs(dz) < 13 && dz > 1) { e.st = 1; e.stT = 0.72; sfxCaw(); }
        } else if (e.st === 1) {
          e.stT -= dt;
          e.y = e.y0 + (0.72 - e.stT) * 1.4;
          if (e.stT <= 0) {
            e.st = 2; e.stT = 1.5;
            const d = Math.hypot(cx - e.x, cz - e.z) || 1;
            e.vx = (cx - e.x) / d * 8.5; e.vz = (cz - e.z) / d * 8.5; e.vy = (cy + 0.3 - e.y) * 1.4;
          }
        } else if (e.st === 2) {
          e.stT -= dt;
          e.x += e.vx * dt; e.z += e.vz * dt; e.y += e.vy * dt;
          e.vy += 5.5 * dt;
          if (e.stT <= 0) { e.st = 3; e.stT = 2.2; }
        } else {
          e.stT -= dt;
          e.x = smooth(e.x, e.x0, 0.05, dt); e.z = smooth(e.z, e.z0, 0.05, dt);
          e.y = smooth(e.y, e.y0 + 1.0, 0.05, dt);
          if (e.stT <= 0) { e.st = 0; e.x = e.x0; e.z = e.z0; e.y = e.y0; }
        }
        if (e.g) {
          twFace(e.g, e.x, e.y, e.z, Math.atan2(e.vx, e.vz) || e.face);
          const flap = Math.sin(e.t * (e.st === 2 ? 26 : 9)) * (e.st === 0 ? 0.12 : 0.55);
          e.g.rotation.z = flap;
        }
        break;
      }
      case 'gnome': {
        if (e.tip === 0 && Math.abs(dz) < 3.0 && Math.abs(e.x - cx) < 2.4) { e.tip = 0.001; sfxGnome(); }
        if (e.tip > 0 && e.tip < 1) {
          e.tip = Math.min(1, e.tip + dt * 1.9);
          if (e.g) { e.g.rotation.x = e.tip * 1.5; e.g.position.y = e.y - e.tip * 0.1; }
        }
        break;
      }
      case 'pigeon': {
        if (e.st === 0) {
          e.y = e.y0 + Math.sin(e.t * 2.2 + e.ph) * 0.02;
          if (Math.abs(dz) < 6.5) { e.st = 1; e.stT = 2.4; sfxFlutter(); flockScatter(); }
        } else {
          e.stT -= dt;
          e.y += (5.5 - e.stT * 0.4) * dt;
          e.x += Math.cos(e.ph * 7.3) * 4.0 * dt;
          e.z += Math.sin(e.ph * 7.3) * 2.6 * dt + 2.2 * dt;
          if (e.stT <= 0) { e.dead = true; if (e.g) e.g.visible = false; }
        }
        if (e.g) { twPos(e.g, e.x, e.y, e.z); e.g.rotation.z = Math.sin(e.t * (e.st ? 30 : 6)) * (e.st ? 0.6 : 0.08); }
        break;
      }
      case 'coon': {
        e.face = Math.atan2(cx - e.x, cz - e.z);
        e.stT -= dt;
        if (e.stT <= 0 && Math.abs(dz) < 17 && dz > -2) {
          e.stT = 2.45;
          const d = Math.hypot(cx - e.x, cz - e.z) || 1;
          fireProj('trash', e.x, e.y + 0.95, e.z, (cx - e.x) / d * 8.0, 5.4, (cz - e.z) / d * 8.0, e);
          sfxTrashThrow();
          e.flash = 0.3;
        }
        if (e.g) {
          e.g.rotation.y = twYaw(e.z, e.face);
          e.g.position.y = e.y + Math.abs(Math.sin(e.t * 2.4)) * 0.03;
          e.g.rotation.x = e.flash > 0 ? -0.22 : 0;
        }
        break;
      }
      case 'vent': {
        const cyc = (e.t + e.ph) % (e.per * 2);
        e.st = cyc < e.per ? 1 : 0;
        if (e.st && e.g) {
          if ((e.t * 40 | 0) % 3 === 0) {
            spark(e.x + 0.6, e.y + 0.3 + Math.random() * 0.4, e.z + (Math.random() - 0.5) * 0.6,
              e.amp * 3.4, 0.8, 0, 0.5, 0.30, 0.02, 0.70, 0.80, 0.95, 0);
          }
        }
        break;
      }
      case 'zap': {
        const cyc = (e.t + e.ph) % (e.per * 2);
        e.st = cyc < e.per ? 1 : 0;
        if (e.g2) {
          e.g2.visible = !!e.st;
          e.g2.material.opacity = 0.55 + Math.random() * 0.45;
        }
        if (e.st && (e.t * 60 | 0) % 7 === 0) sfxZap();
        break;
      }
    }
  }
}

/* pigeon scatter: the whole flock leaves at once and the frame flashes
   pale for a beat — "blocks vision" without a per-frame filter */
let flashT = 0;
function flockScatter() {
  for (const e of ENTS) if (e.k === 'pigeon' && e.st === 0 && Math.abs(e.z - CAT.z) < 14) { e.st = 1; e.stT = 2.4; }
  flashT = 0.42;
}

/* ── projectile step: gravity, reflect windows, hits ─────────────────── */
function updateProj(dt) {
  for (let i = 0; i < PROJ.length; i++) {
    const p = PROJ[i];
    if (!p.on) continue;
    p.t += dt;
    /* per-kind gravity.  `honey` is DELIBERATELY light (9): the design asks
       for "slow arcs … stickier physics", and a lazy high arc is what makes a
       three-hit tail-whip reflect fight readable for a six-year-old.  `box`
       is heavy (21) so a dropped package lands where its shadow says. */
    p.vy -= (p.k === 'water' ? 13 : p.k === 'toast' ? 17 : p.k === 'honey' ? 9
      : p.k === 'box' ? 21 : 15) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    p.spin += dt * (p.k === 'toast' ? 7 : p.k === 'honey' ? 1.2 : p.k === 'box' ? 2.2 : 3);
    twPos(p.g, p.x, p.y, p.z);
    p.g.rotation.set(p.spin * 0.7, p.spin, p.spin * 0.4);
    if (p.y < groundAt(p.x, p.z) - 0.4 || p.t > 6 || p.z < CAT.z - 26 || p.z > CAT.z + 70) {
      if (p.y < groundAt(p.x, p.z) + 0.2 && p.t < 6) {
        if (p.k === 'water') sfxSplat(0.5);
        else if (p.k === 'trash') sfxSplat(0.8);
        else if (p.k === 'honey') sfxHoneySplat();
        /* a dropped package BURSTS INTO PACKING PEANUTS (LEVELS2 §B) — the
           whole joke of the drone, and it is why the boxes read as harmless
           once they have landed */
        else if (p.k === 'box') peanutBurst(p.x, p.y + 0.2, p.z);
        for (let s = 0; s < 4; s++)
          spark(p.x, p.y + 0.1, p.z, (Math.random() - 0.5) * 2, Math.random() * 2, (Math.random() - 0.5) * 2,
            0.32, 0.18, 0.02, p.k === 'water' ? 0.6 : 0.5, p.k === 'water' ? 0.85 : 0.42, p.k === 'water' ? 1.0 : 0.30, 8);
      }
      p.on = false; p.g.visible = false;
      continue;
    }
    /* a cat-owned (reflected) projectile bonks whatever it reaches */
    if (p.own === 1) {
      for (let j = 0; j < ENTS.length; j++) {
        const e = ENTS[j];
        if (!e.alive || !e.bonk) continue;
        /* A reflected projectile is THE ranged answer (design §2) and it is
           on the mercy path, so its hit box is generous — the boss version
           (bossProjHit) always used a ~3 m vertical window while this one
           used e.h + 0.7, and the reflect arc (vy is floored at 3.2) sails
           roughly 0.2 m OVER a raccoon's head at typical range: a perfect
           whip visibly bonked nothing.  Traced with a per-tick projectile
           dump, 2026-09-27.  Matching the boss window fixes it. */
        if (Math.abs(e.z - p.z) < e.r + 0.7 && Math.abs(e.x - p.x) < e.r + 0.7 &&
            p.y > e.y - 0.5 && p.y < e.y + e.h + 1.6) {
          killEnt(e);
          REFLECT_KILLS++;
          p.on = false; p.g.visible = false;
          break;
        }
      }
      if (BOSS && BOSS.alive && p.own === 1) bossProjHit(p);
    }
  }
}

/* ── P2 LASER BUDDY ──────────────────────────────────────────────────
   No second camera, no second rig: a red dot on the ground, a glow, and a
   0.6 s hover that mesmerizes.  Sweeping it over kibble collects it into
   the shared score.  Resting it in front of the cat makes him chirp — zero
   gameplay effect, pure joy, and it stays (design §7).               */
const LASER = {
  on: false, x: 0, y: 0, z: 0, dot: null, hoverE: null, hoverT: 0,
  chirpT: 0, joinFlashT: 0,
};
function buildLaser() {
  if (LASER.dot) return;
  const m = vcMesh([vcCyl(0.13, 0.13, 0.01, 12, 0xff2a2a)],
    new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false }));
  m.renderOrder = 5;
  m.visible = false;
  scene.add(m);
  LASER.dot = m;
}
function laserJoin() {
  if (LASER.on) return;
  buildLaser();
  LASER.on = true;
  LASER.x = CAT.x; LASER.z = CAT.z + 3.0;
  LASER.joinFlashT = 1.6;
  sfxChirp(1.1);
}
function laserLeave() {
  LASER.on = false;
  if (LASER.dot) LASER.dot.visible = false;
  for (const e of ENTS) e.mesm = 0;
}
function updateLaser(dt, lx, lz) {
  if (!LASER.on) return;
  const SP = 9.5;
  LASER.x += lx * SP * dt;
  LASER.z += lz * SP * dt;
  /* always within the camera's view: clamped to the corridor and a window
     around the cat, so P2 can never lose the dot off-screen */
  const hw = corrHW(LASER.z);
  LASER.x = clamp(LASER.x, -hw + 0.4, hw - 0.4);
  LASER.z = clamp(LASER.z, CAT.z - 7, CAT.z + 26);
  LASER.y = groundAt(LASER.x, LASER.z) + 0.02;
  LASER.dot.visible = true;
  twPos(LASER.dot, LASER.x, LASER.y, LASER.z);
  const pulse = 1 + Math.sin(simT * 22) * 0.12;
  LASER.dot.scale.set(pulse, 1, pulse);

  /* hover an enemy 0.6s → mesmerized */
  let best = null, bd = 1.3;
  for (const e of ENTS) {
    if (!e.alive || e.k === 'cuke' || e.k === 'vent' || e.k === 'zap') continue;
    const d = Math.hypot(e.x - LASER.x, e.z - LASER.z);
    if (d < bd) { bd = d; best = e; }
  }
  if (best && best === LASER.hoverE) {
    LASER.hoverT += dt;
    if (LASER.hoverT > 0.6 && best.mesm <= 0) { best.mesm = 4.0; sfxChirp(1.4); }
  } else { LASER.hoverE = best; LASER.hoverT = 0; }

  /* sweep kibble → shared score */
  for (let i = 0; i < KIBS.length; i++) {
    const k = KIBS[i];
    if (!k.on) continue;
    if (Math.abs(k.x - LASER.x) < 0.95 && Math.abs(k.z - LASER.z) < 0.95 && Math.abs(k.y - LASER.y) < 1.6) {
      k.on = false; gainKibble(1, k.x, k.y, k.z);
    }
  }
  /* resting the dot in front of the cat → happy chirp + tail flick */
  const front = LASER.z - CAT.z;
  if (front > 0.7 && front < 2.6 && Math.abs(LASER.x - CAT.x) < 1.1 && Math.abs(lx) < 0.2 && Math.abs(lz) < 0.2) {
    LASER.chirpT += dt;
    if (LASER.chirpT > 0.8) {
      LASER.chirpT = -2.4;
      sfxChirp(1.0);
      CAT.tailFlick = 1;
      for (let s = 0; s < 4; s++)
        spark(CAT.x + (Math.random() - 0.5) * 0.5, CAT.y + 0.9, CAT.z + (Math.random() - 0.5) * 0.5,
          0, 1.2, 0, 0.6, 0.14, 0.02, 1.0, 0.75, 0.85, 0);
    }
  } else if (LASER.chirpT > 0) LASER.chirpT = 0;
  else LASER.chirpT = Math.min(0, LASER.chirpT + dt);
}
let REFLECT_KILLS = 0;
</script>
