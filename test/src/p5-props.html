<script>
/* ═══════════════════ ZOOMIES! — p5  world builder + props ══════════════
   The corridor is authored as CHUNK DATA (p6) and this file is the engine
   that turns that data into geometry, collision and spawns.  Laws:

   · geometry is MERGED into 40 m bands — one lit mesh per band, so the
     whole static world in view is ~4 draw calls (LAW: no world-sized
     canvases/textures, bake per band, and measure the bake)
   · static world RECEIVES the shadow map and NEVER casts it
   · emissive faces (lit windows, neon) skip the bake and go in the same
     merged mesh — they are the light source, not a lit surface
   · collision is AABBs bucketed into 4 m z-bins; the cat only ever tests
     the two bins it straddles                                           */

const BAND = 40;                 // metres of corridor per merged mesh
const BINZ = 4;                  // metres of corridor per collision bucket

const WORLD = {
  bands: [], solids: [], bins: [], movers: [], glows: [], corridor: [],
  ceil: [], checkpoints: [], length: 0, far: null, theme: 'house', pal: null,
  bakeMs: 0, tris: 0,
};

function clearWorld() {
  for (const b of WORLD.bands) { scene.remove(b.mesh); b.mesh.geometry.dispose(); }
  if (WORLD.far) { scene.remove(WORLD.far); WORLD.far.geometry.dispose(); }
  for (const m of WORLD.movers) if (m.g) { scene.remove(m.g); m.g.geometry.dispose(); }
  for (const c of WORLD.solids) if (c.g) { scene.remove(c.g); c.g.geometry.dispose(); }
  for (const c of WORLD.checkpoints) if (c.g) { scene.remove(c.g); disposeTree(c.g); }
  WORLD.bands.length = 0; WORLD.solids.length = 0; WORLD.bins.length = 0;
  WORLD.movers.length = 0; WORLD.glows.length = 0; WORLD.corridor.length = 0;
  WORLD.checkpoints.length = 0; WORLD.ceil.length = 0;
  WORLD.far = null; WORLD.length = 0; WORLD.tris = 0;
  CRATES.length = 0;
}
function disposeTree(o) {
  o.traverse(c => { if (c.isMesh && c.geometry) c.geometry.dispose(); });
}

/* ── the build context ─────────────────────────────────────────────── */
let _mds = null, _farMD = null, _rnd = null, _pal = null;

function bandMD(z) {
  let i = Math.floor(z / BAND);
  if (i < 0) i = 0;
  while (_mds.length <= i) _mds.push(MD());
  return _mds[i];
}
/* geometry only */
function G(cx, cy, cz, sx, sy, sz, c, ry) { boxMD(bandMD(cz), cx, cy, cz, sx, sy, sz, c, ry, false); }
/* emissive geometry (skips the bake) */
function GE(cx, cy, cz, sx, sy, sz, c, ry) { boxMD(bandMD(cz), cx, cy, cz, sx, sy, sz, c, ry, true); }
/* collision only */
function S(cx, cy, cz, sx, sy, sz, kind) {
  WORLD.solids.push({
    x0: cx - sx / 2, x1: cx + sx / 2, y0: cy - sy / 2, y1: cy + sy / 2,
    z0: cz - sz / 2, z1: cz + sz / 2, kind: kind || 'solid', on: true,
    cx, cy, cz, sx, sy, sz,
  });
}
/* geometry + collision */
function B(cx, cy, cz, sx, sy, sz, c, ry, kind) { G(cx, cy, cz, sx, sy, sz, c, ry); S(cx, cy, cz, sx, sy, sz, kind); }
function FLOORQ(x0, z0, x1, z1, y, c) { quadY(bandMD((z0 + z1) / 2), x0, z0, x1, z1, y, c); }
function CYL(cx, cy, cz, rt, rb, h, seg, c) { cylMD(bandMD(cz), cx, cy, cz, rt, rb, h, seg, c); }
function DOME(cx, cy, cz, r, ry2, seg, rings, c) { domeMD(bandMD(cz), cx, cy, cz, r, ry2, seg, rings, c); }
/* a static glow (treats, checkpoints, neon, lamps) — all of them share the
   single instanced additive draw call */
function GLOW(x, y, z, s, hex, pulse) {
  const c = rgb(hex);
  WORLD.glows.push({ x, y, z, s, r: c[0], g: c[1], b: c[2], pulse: pulse || 0 });
}

/* ═══════════════════════ HOUSE props ═══════════════════════════════ */
function propCouch(x, z, ry, P) {
  const seat = 0.46;
  B(x, seat / 2, z, 2.3, seat, 1.05, P.couch, ry);                   // seat block (standable)
  G(x, seat + 0.26, z - 0.42, 2.3, 0.56, 0.22, P.couchD, ry);        // backrest
  S(x, seat + 0.26, z - 0.42, 2.3, 0.56, 0.24, 'solid');
  for (const s of [-1, 1]) {
    G(x + s * 1.06, seat / 2 + 0.16, z, 0.22, seat + 0.32, 1.05, P.couchD, ry);
    S(x + s * 1.06, seat / 2 + 0.16, z, 0.22, seat + 0.32, 1.05, 'solid');
  }
  for (const s of [-0.62, 0.62]) G(x + s, seat + 0.09, z + 0.06, 0.92, 0.18, 0.78, P.cushion, ry);
  for (const s of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
    G(x + s[0] * 1.0, 0.06, z + s[1] * 0.42, 0.14, 0.12, 0.14, P.wood, ry);
}
function propTable(x, z, w, d, h, P) {   // low table: ROLL UNDER it, jump ON it
  B(x, h, z, w, 0.12, d, P.wood);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const lx = x + sx * (w / 2 - 0.14), lz = z + sz * (d / 2 - 0.14);
    G(lx, h / 2, lz, 0.12, h, 0.12, P.woodD);
    S(lx, h / 2, lz, 0.12, h, 0.12, 'solid');
  }
  G(x, h + 0.10, z - d * 0.2, 0.34, 0.08, 0.24, P.book1);            // a magazine on top
}
function propShelf(x, z, ry, h, P) {
  B(x, h / 2, z, 1.5, h, 0.52, P.wood, ry);
  const cols = [P.book1, P.book2, P.book3, P.book4];
  for (let s = 0; s < 3; s++) {
    const sy = 0.42 + s * (h - 0.6) / 3;
    G(x, sy, z, 1.44, 0.05, 0.5, P.woodD, ry);
    for (let i = 0; i < 6; i++) {
      const bw = 0.10 + _rnd() * 0.08, bh = 0.24 + _rnd() * 0.10;
      G(x - 0.6 + i * 0.22, sy + bh / 2 + 0.03, z + 0.02, bw, bh, 0.34, cols[(i + s) % 4], ry);
    }
  }
}
function propCounter(x, z, len, P) {
  B(x, 0.46, z, len, 0.92, 1.0, P.counterD);
  G(x, 0.96, z, len + 0.10, 0.10, 1.10, P.counter);                  // countertop lip
  S(x, 0.96, z, len + 0.10, 0.10, 1.10, 'solid');
  for (let i = 0; i < Math.floor(len / 0.9); i++)
    G(x - len / 2 + 0.45 + i * 0.9, 0.62, z + 0.51, 0.72, 0.5, 0.03, P.counter);
  for (let i = 0; i < Math.floor(len / 0.9); i++)
    G(x - len / 2 + 0.45 + i * 0.9, 0.86, z + 0.53, 0.18, 0.04, 0.04, P.metal);
}
function propFridge(x, z, P) {
  B(x, 1.05, z, 1.05, 2.10, 0.95, P.fridge);
  G(x, 1.36, z + 0.49, 1.00, 1.34, 0.04, P.fridgeD);
  G(x, 0.44, z + 0.49, 1.00, 0.78, 0.04, P.fridgeD);
  G(x + 0.40, 1.36, z + 0.53, 0.06, 0.66, 0.06, P.metal);
  G(x + 0.40, 0.52, z + 0.53, 0.06, 0.40, 0.06, P.metal);
  for (let i = 0; i < 4; i++)                                        // fridge magnets + kid art
    G(x - 0.32 + i * 0.22, 1.70 - (i % 2) * 0.16, z + 0.50, 0.11, 0.11, 0.03,
      [P.rug, P.book2, P.plantL, P.book4][i]);
}
function propRug(x, z, w, d, P) {
  FLOORQ(x - w / 2, z - d / 2, x + w / 2, z + d / 2, 0.012, P.rug);
  FLOORQ(x - w / 2 + 0.24, z - d / 2 + 0.24, x + w / 2 - 0.24, z + d / 2 - 0.24, 0.016, P.rug2);
}
function propLamp(x, z, P) {
  G(x, 0.03, z, 0.40, 0.06, 0.40, P.woodD);
  CYL(x, 0.75, z, 0.035, 0.045, 1.44, 6, P.metal);
  const md = bandMD(z);
  cylMD(md, x, 1.63, z, 0.24, 0.34, 0.36, 8, rgb(P.shade));
  GE(x, 1.47, z, 0.42, 0.04, 0.42, P.lampLit);
  GLOW(x, 1.55, z, 2.5, P.lampGlow, 0.4);
  S(x, 0.7, z, 0.34, 1.4, 0.34, 'solid');
}
function propPlant(x, z, P) {
  CYL(x, 0.22, z, 0.24, 0.19, 0.44, 7, P.pot);
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU, r = 0.18 + _rnd() * 0.1;
    const h = 0.5 + _rnd() * 0.55;
    G(x + Math.cos(a) * r, 0.44 + h / 2, z + Math.sin(a) * r, 0.09, h, 0.16,
      i % 2 ? P.plantL : P.plantD, a);
  }
  S(x, 0.45, z, 0.5, 0.9, 0.5, 'solid');
}
/* BREAKABLE crate — scratch / roll / pounce / zoomies pops it, so unlike
   every other prop its geometry canNOT live in the merged band mesh.  It
   gets its own little mesh (distance-culled) and a 'crate' solid. */
const CRATES = [];
function propCrate(x, y, z, s, P) {
  const e = s * 0.92, t = s * 0.09;
  const m = vcMesh([
    vcBox(s, s, s, P.crate),
    vcBox(e, t, s + 0.012, P.crateD),
    vcBox(t, e, s + 0.012, P.crateD),
    vcBox(s + 0.012, t, e, P.crateD),
    vcBox(s + 0.012, e, t, P.crateD),
    vcBox(e, s + 0.012, t, P.crateD),
  ]);
  m.position.set(x, y + s / 2, z);
  if (LOOK && FX.shadow) m.castShadow = true;
  scene.add(m);
  const sol = { x0: x - s / 2, x1: x + s / 2, y0: y, y1: y + s, z0: z - s / 2, z1: z + s / 2,
    kind: 'crate', on: true, cx: x, cy: y + s / 2, cz: z, sx: s, sy: s, sz: s,
    g: m, col: P.crate, colD: P.crateD };
  WORLD.solids.push(sol);
  CRATES.push(sol);
}
/* The opening is deliberately TALLER than the camera boom (cat.y + 2.55) and
   wider than the cat's lane: a low lintel put the header right in the lens
   every time he ran through a door, which read as the screen going blank. */
function propDoorway(x, z, P) {
  for (const sg of [-1, 1]) {
    G(x + sg * 3.45, 1.50, z, 2.5, 3.00, 0.34, P.wallLow);
    S(x + sg * 3.45, 1.50, z, 2.5, 3.00, 0.34, 'solid');
    G(x + sg * 2.28, 1.50, z, 0.16, 3.00, 0.42, P.trim);
  }
  G(x, 3.10, z, 9.0, 0.22, 0.38, P.wallLow);
  G(x, 3.05, z, 4.8, 0.14, 0.44, P.trim);
}
/* A window is always ON a side wall, facing into the corridor.  It throws a
   warm unlit floor patch inward and registers one soft glow — the honey
   light the house level is made of. */
function propWindow(x, y, z, w, h, P) {
  const s = x < 0 ? 1 : -1;                    // inward direction (+x or -x)
  const ry = Math.PI / 2;
  G(x, y, z, w + 0.24, h + 0.24, 0.10, P.trim, ry);
  GE(x + s * 0.06, y, z, w, h, 0.05, P.winLit, ry);
  G(x + s * 0.09, y, z, 0.03, h, 0.07, P.trim, ry);
  G(x + s * 0.09, y, z, 0.03, 0.07, w, P.trim, ry);
  GLOW(x + s * 0.6, y, z, Math.max(w, h) * 2.0, P.winGlow, 0);
  /* the warm shaft on the floor: a flat unlit quad leaning down-corridor */
  const md = bandMD(z);
  const yb = 0.02, c = rgb(P.sunPatch);
  const nx = x + s * 0.2, fx = x + s * 3.4;
  pushTriRaw(md, nx, yb, z - w / 2 - 0.3, nx, yb, z + w / 2 + 0.3, fx, yb, z + w / 2 + 1.9, c);
  pushTriRaw(md, nx, yb, z - w / 2 - 0.3, fx, yb, z + w / 2 + 1.9, fx, yb, z - w / 2 + 1.1, c);
}
function propCatTree(x, z, P) {
  G(x, 0.06, z, 0.9, 0.12, 0.9, P.woodD);
  CYL(x, 0.8, z, 0.14, 0.16, 1.4, 7, P.catpost);
  B(x, 1.54, z, 0.86, 0.14, 0.86, P.cushion);
  CYL(x + 0.02, 1.9, z, 0.12, 0.13, 0.62, 7, P.catpost);
  B(x, 2.28, z, 0.72, 0.14, 0.72, P.cushion);
}

/* ═══════════════════════ YARD props ════════════════════════════════ */
function propFenceRun(x, z0, z1, P) {
  for (let z = z0; z < z1; z += 2.0) {
    G(x, 0.62, z, 0.14, 1.24, 0.14, P.fenceD);
    S(x, 0.62, z, 0.16, 1.24, 0.16, 'solid');
  }
  G(x, 0.72, (z0 + z1) / 2, 0.06, 0.16, z1 - z0, P.fence);
  G(x, 0.36, (z0 + z1) / 2, 0.06, 0.16, z1 - z0, P.fence);
  for (let z = z0; z < z1; z += 0.34) G(x, 0.62, z, 0.05, 1.20, 0.26, P.fence);
  S(x, 1.4, (z0 + z1) / 2, 0.2, 1.4, z1 - z0, 'solid');
}
function propFenceTop(x, z0, z1, y, P) {   // the balance run — a walkable rail
  B(x, y, (z0 + z1) / 2, 0.52, 0.16, z1 - z0, P.fence);
  for (let z = z0 + 1; z < z1; z += 2.4) {
    G(x, (y - 0.08) / 2, z, 0.16, y - 0.08, 0.16, P.fenceD);
    S(x, (y - 0.08) / 2, z, 0.18, y - 0.08, 0.18, 'solid');
  }
  for (let z = z0; z < z1; z += 0.34) G(x, (y - 0.08) * 0.55, z, 0.06, y * 0.9, 0.26, P.fence);
}
function propBush(x, z, r, P) {
  /* taller than wide, in three lumps — a flat wide dome reads as an
     umbrella, not a shrub */
  DOME(x, 0.02, z, r * 0.86, r * 1.35, 7, 3, P.bush);
  DOME(x - r * 0.52, 0.02, z - r * 0.22, r * 0.60, r * 0.95, 6, 2, P.bushD);
  DOME(x + r * 0.54, 0.02, z + r * 0.30, r * 0.56, r * 0.88, 6, 2, P.bushD);
  S(x, r * 0.4, z, r * 1.7, r * 0.8, r * 1.7, 'solid');
}
function propTree(x, z, h, P) {
  CYL(x, h * 0.34, z, 0.17, 0.26, h * 0.68, 7, P.bark);
  DOME(x, h * 0.62, z, h * 0.44, h * 0.46, 8, 3, rgb(P.leaf));
  DOME(x - h * 0.2, h * 0.52, z + h * 0.12, h * 0.3, h * 0.3, 7, 2, rgb(P.leafD));
  DOME(x + h * 0.22, h * 0.56, z - h * 0.1, h * 0.28, h * 0.3, 7, 2, rgb(P.leafD));
  S(x, h * 0.34, z, 0.5, h * 0.68, 0.5, 'solid');
}
function propPlanterRow(x, z, len, P) {
  B(x, 0.20, z, 2.0, 0.40, len, P.dirt);
  G(x, 0.44, z, 2.10, 0.12, len + 0.10, P.plank);
  S(x, 0.44, z, 2.10, 0.12, len + 0.10, 'solid');
  for (let i = 0; i < len / 0.8; i++) {
    const zz = z - len / 2 + 0.4 + i * 0.8;
    for (const sx of [-0.5, 0.5]) {
      G(x + sx, 0.62, zz, 0.10, 0.34, 0.10, P.stem);
      DOME(x + sx, 0.76, zz, 0.22, 0.22, 6, 2, rgb(i % 2 ? P.leaf : P.leafD));
    }
  }
}
/* The deck's walking surface comes from the level's own floor op (one
   emitter per surface — two would z-fight).  This adds the fascia and the
   rails that make it read as a porch. */
function propDeck(x, z0, z1, w, y, P) {
  for (const sx of [-1, 1]) G(x + sx * (w / 2 + 0.02), y - 0.28, (z0 + z1) / 2, 0.14, 0.56, z1 - z0, P.railD);
  G(x, y - 0.28, z1 + 0.02, w + 0.3, 0.56, 0.14, P.railD);
  for (const sx of [-1, 1]) {
    G(x + sx * (w / 2 + 0.06), y + 0.46, (z0 + z1) / 2, 0.10, 0.90, z1 - z0, P.rail);
    S(x + sx * (w / 2 + 0.06), y + 0.46, (z0 + z1) / 2, 0.12, 0.90, z1 - z0, 'solid');
    for (let z = z0; z < z1; z += 1.2) G(x + sx * (w / 2 + 0.06), y + 0.30, z, 0.12, 0.60, 0.12, P.railD);
  }
}
function propBirdbath(x, z, P) {
  CYL(x, 0.10, z, 0.34, 0.46, 0.20, 8, P.stone);
  CYL(x, 0.52, z, 0.16, 0.20, 0.72, 8, P.stone);
  CYL(x, 0.94, z, 0.58, 0.40, 0.18, 10, P.stoneD);
  const md = bandMD(z);
  cylMD(md, x, 1.02, z, 0.52, 0.52, 0.02, 10, rgb(P.water));
  GLOW(x, 1.06, z, 1.2, P.waterGlow, 0.7);
  /* the pedestal stops SHORT of the rim so the bowl is unambiguously the
     top surface — the rim is the trampoline */
  S(x, 0.46, z, 0.5, 0.92, 0.5, 'solid');
  S(x, 1.00, z, 1.20, 0.14, 1.20, 'tramp');
}
/* Roof built from two ROTATED SLABS rather than raw gable triangles — the
   hand-wound tris came out backface-culled from the player's side and the
   roof read as two dark flaps.  Slabs are always wound correctly. */
function propDoghouse(x, z, ry, P) {
  const cs = Math.cos(ry), sn = Math.sin(ry);
  B(x, 0.55, z, 1.9, 1.10, 1.7, P.dog1, ry);
  const md = bandMD(z);
  for (const sg of [-1, 1]) {
    /* each roof plane: a slab tilted about the ridge axis (local X) */
    const tilt = sg * 0.62;
    const cx = x + sn * (sg * 0.50), cz = z + cs * (sg * 0.50);
    const rx = Math.cos(tilt), ry2 = Math.sin(tilt);
    const hx = 1.12, hy = 0.09, hz = 0.72;
    const P8 = [];
    for (let i = 0; i < 8; i++) {
      const lx = (i & 1) ? hx : -hx, ly = (i & 2) ? hy : -hy, lz = (i & 4) ? hz : -hz;
      /* tilt about local X, then yaw by ry */
      const ty = ly * rx - lz * ry2, tz = ly * ry2 + lz * rx;
      P8.push([cx + lx * cs + tz * sn, 1.40 + ty, cz - lx * sn + tz * cs]);
    }
    const F = [[0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4], [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]];
    for (const f of F) {
      const A = P8[f[0]], Bv = P8[f[1]], C = P8[f[2]], D = P8[f[3]];
      pushTri(md, A[0], A[1], A[2], Bv[0], Bv[1], Bv[2], C[0], C[1], C[2], P.dog2);
      pushTri(md, A[0], A[1], A[2], C[0], C[1], C[2], D[0], D[1], D[2], P.dog2);
    }
  }
  /* the arched doorway, always on the side the cat approaches from */
  G(x - sn * 0.88, 0.44, z - cs * 0.88, 0.78, 0.88, 0.10, 0x241616, ry);
  G(x - sn * 0.90, 0.92, z - cs * 0.90, 0.86, 0.14, 0.12, P.dog2, ry);
  /* a name board, because he is a good boy */
  G(x - sn * 0.92, 1.14, z - cs * 0.92, 0.96, 0.24, 0.08, 0xf2e2c0, ry);
  /* LAW (Rex fight): the roof is a TRAMPOLINE */
  S(x, 1.46, z, 2.1, 0.5, 1.8, 'tramp');
}
function propHose(x, z, P) {
  for (let i = 0; i < 26; i++) {
    const a = i * 0.62, r = 0.5 + i * 0.026;
    G(x + Math.cos(a) * r, 0.05, z + Math.sin(a) * r * 0.7, 0.16, 0.10, 0.16, P.hose);
  }
}
function propShed(x, z, P) {
  B(x, 1.25, z, 3.4, 2.5, 2.6, P.shed);
  G(x, 2.62, z, 3.7, 0.26, 2.9, P.shedD);
  G(x, 1.05, z + 1.32, 1.2, 2.0, 0.08, P.shedD);
}
function propGate(x, z, P) {
  for (const sx of [-1, 1]) {
    G(x + sx * 1.9, 1.05, z, 0.22, 2.10, 0.22, P.fenceD);
    S(x + sx * 1.9, 1.05, z, 0.24, 2.10, 0.24, 'solid');
  }
  G(x, 2.22, z, 4.2, 0.24, 0.30, P.fenceD);
}

/* ═══════════════════════ ROOF / NIGHT props ═══════════════════════ */
function propChimney(x, z, h, P) {
  B(x, h / 2, z, 0.95, h, 0.95, P.brick);
  G(x, h + 0.09, z, 1.12, 0.18, 1.12, P.brickD);
  GE(x, h + 0.20, z, 0.46, 0.06, 0.46, 0x2a2030);
}
function propParapet(x, z0, z1, side, P) {
  G(x, 0.30, (z0 + z1) / 2, 0.36, 0.60, z1 - z0, P.parapet);
  S(x, 0.30, (z0 + z1) / 2, 0.36, 0.60, z1 - z0, 'solid');
  G(x, 0.64, (z0 + z1) / 2, 0.46, 0.10, z1 - z0, P.parapetD);
}
function propAC(x, y, z, P) {
  B(x, y + 0.36, z, 1.30, 0.72, 1.10, P.metal);
  G(x, y + 0.74, z, 1.22, 0.10, 1.02, P.metalD);
  CYL(x, y + 0.78, z, 0.34, 0.34, 0.06, 10, P.metalD);
  for (let i = 0; i < 4; i++) G(x, y + 0.80, z, 0.10, 0.04, 0.62, P.metal, i * 0.78);
}
function propAntenna(x, y, z, P) {
  CYL(x, y + 0.9, z, 0.05, 0.07, 1.8, 6, P.metal);
  for (let i = 0; i < 5; i++) G(x, y + 1.1 + i * 0.28, z, 0.9 - i * 0.14, 0.04, 0.04, P.metal);
  GE(x, y + 1.86, z, 0.11, 0.11, 0.11, 0xff4040);
  GLOW(x, y + 1.90, z, 0.9, 0xff3030, 1.6);
}
/* A neon sign faces the player: signs out at the corridor edge turn inward,
   signs on the centre line face back down-corridor (-Z).  Design caps the
   additive glow layer, and the instanced glow pool makes all of them one
   draw call anyway. */
function propNeon(x, y, z, w, h, hex, P) {
  const side = Math.abs(x) > 3;
  const s = x < 0 ? 1 : -1;
  const ry = side ? Math.PI / 2 : 0;
  const gx = side ? x + s * 0.6 : x;
  const gz = side ? z : z - 0.6;
  G(x, y, z, side ? 0.20 : w + 0.22, h + 0.22, side ? w + 0.22 : 0.20, P.metalD);
  if (side) GE(x + s * 0.12, y, z, 0.05, h, w, hex);
  else GE(x, y, z - 0.12, w, h, 0.05, hex);
  GLOW(gx, y, gz, Math.max(w, h) * 2.2, hex, 0.9);
  const bx = side ? 0 : 1, bz = side ? 1 : 0;
  for (const sg of [-1, 1]) {
    G(x + bx * sg * (w / 2 + 0.2), y - h / 2 - 0.55, z + bz * sg * (w / 2 + 0.2), 0.12, 1.1, 0.12, P.metalD);
  }
  S(x, y, z, side ? 0.32 : w + 0.22, h + 0.22, side ? w + 0.22 : 0.32, 'solid');
}
function propClothesPole(x, z, h, P) {
  CYL(x, h / 2, z, 0.08, 0.11, h, 6, P.metal);
  G(x, h - 0.1, z, 1.5, 0.08, 0.08, P.metal);
  S(x, h / 2, z, 0.2, h, 0.2, 'solid');
}
function propClothesline(x0, z0, x1, z1, y, P, n) {
  const md = bandMD((z0 + z1) / 2);
  const steps = 10;
  for (let i = 0; i < steps; i++) {
    const t0 = i / steps, t1 = (i + 1) / steps;
    const sag0 = Math.sin(t0 * Math.PI) * 0.28, sag1 = Math.sin(t1 * Math.PI) * 0.28;
    const a = [lerp(x0, x1, t0), y - sag0, lerp(z0, z1, t0)];
    const b = [lerp(x0, x1, t1), y - sag1, lerp(z0, z1, t1)];
    boxMD(md, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2,
      Math.hypot(b[0] - a[0], b[2] - a[2]) + 0.04, 0.05, 0.05,
      rgb(P.rope), Math.atan2(b[0] - a[0], b[2] - a[2]) + Math.PI / 2);
  }
  const cols = [P.cloth1, P.cloth2, P.cloth3];
  for (let i = 0; i < (n || 4); i++) {
    const t = 0.16 + i * 0.66 / Math.max(1, (n || 4) - 1);
    const sag = Math.sin(t * Math.PI) * 0.28;
    G(lerp(x0, x1, t), y - sag - 0.36, lerp(z0, z1, t), 0.62, 0.70, 0.04, cols[i % 3]);
  }
}
function propDumpster(x, z, ry, P) {
  B(x, 0.62, z, 2.5, 1.24, 1.5, P.dump, ry);
  G(x, 1.28, z, 2.6, 0.12, 1.6, P.dumpD, ry);
  for (const sx of [-1, 1]) G(x + sx * 1.1, 0.16, z, 0.2, 0.32, 0.2, P.metalD, ry);
  S(x, 1.30, z, 2.6, 0.14, 1.6, 'solid');
}
function propAwning(x, y, z, w, d, hex, P) {   // TRAMPOLINE
  const md = bandMD(z);
  const c = rgb(hex), c2 = rgb(P.awn2);
  for (let i = 0; i < 6; i++) {
    const x0 = x - w / 2 + i * w / 6, x1 = x - w / 2 + (i + 1) * w / 6;
    const cc = i % 2 ? c : c2;
    pushTri(md, x0, y, z - d / 2, x1, y, z - d / 2, x1, y - 0.42, z + d / 2, cc);
    pushTri(md, x0, y, z - d / 2, x1, y - 0.42, z + d / 2, x0, y - 0.42, z + d / 2, cc);
  }
  G(x, y - 0.46, z + d / 2, w, 0.12, 0.12, P.metalD);
  S(x, y - 0.22, z, w, 0.34, d, 'tramp');
}
function propWaterTower(x, z, P) {
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const md = bandMD(z);
    boxMD(md, x + sx * 2.1, 1.9, z + sz * 2.1, 0.22, 3.8, 0.22, rgb(P.towerLeg), sx * sz * 0.06);
    S(x + sx * 2.1, 1.9, z + sz * 2.1, 0.26, 3.8, 0.26, 'solid');
  }
  for (const yy of [1.2, 2.6]) {
    G(x, yy, z - 2.1, 4.4, 0.10, 0.10, P.towerLeg);
    G(x, yy, z + 2.1, 4.4, 0.10, 0.10, P.towerLeg);
    G(x - 2.1, yy, z, 0.10, 0.10, 4.4, P.towerLeg);
    G(x + 2.1, yy, z, 0.10, 0.10, 4.4, P.towerLeg);
  }
  B(x, 3.92, z, 5.6, 0.26, 5.6, P.towerDeck);                       // the arena floor
  CYL(x, 5.5, z, 2.0, 2.2, 3.0, 12, P.tower);
  DOME(x, 7.0, z, 2.0, 1.0, 12, 2, rgb(P.towerD));
  for (let i = 0; i < 12; i++) G(x, 5.5, z, 4.5, 0.08, 0.08, P.towerD, i * 0.26);
  GLOW(x, 7.6, z, 3.0, P.towerGlow, 0.5);
}
/* the night skyline: ONE unlit merged mesh far behind, lit windows and all.
   fog:false so it stays crisp against the indigo dome — this is the vista. */
function buildSkyline(pal, z0, z1) {
  const md = _farMD;
  const rnd = mkRnd(90210);
  /* windows: a grid of little unlit quads on the face that is actually
     turned toward the player.  This is the whole reason the night level
     exists, so both the down-corridor face AND the inward side get them. */
  function winGrid(bx, bz, w, d, h, face) {
    const rows = Math.floor((h - 4) / 4.2), cols = Math.floor((face === 'z' ? w : d) / 3.4);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (rnd() > 0.52) continue;
      const wy = 3.4 + r * 4.2;
      if (wy > h - 2.2) continue;
      const lit = rnd() > 0.34 ? pal.winA : pal.winB;
      const hw = 0.85, hh = 1.15;
      if (face === 'z') {
        const wx = bx - w / 2 + 1.7 + c * 3.4, zf = bz - d / 2 - 0.06;
        pushTriRaw(md, wx - hw, wy - hh, zf, wx + hw, wy - hh, zf, wx + hw, wy + hh, zf, lit);
        pushTriRaw(md, wx - hw, wy - hh, zf, wx + hw, wy + hh, zf, wx - hw, wy + hh, zf, lit);
      } else {
        const wz = bz - d / 2 + 1.7 + c * 3.4, xf = bx + (bx < 0 ? w / 2 + 0.06 : -w / 2 - 0.06);
        pushTriRaw(md, xf, wy - hh, wz - hw, xf, wy - hh, wz + hw, xf, wy + hh, wz + hw, lit);
        pushTriRaw(md, xf, wy - hh, wz - hw, xf, wy + hh, wz + hw, xf, wy + hh, wz - hw, lit);
      }
    }
  }
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 22; i++) {
      /* pushed well out: at 34 m they towered over the rooftop and ate the
         frame; the vista wants distance, not scale */
      const bx = side * (58 + rnd() * 150);
      const bz = z0 + rnd() * (z1 - z0);
      const w = 13 + rnd() * 22, d = 13 + rnd() * 20, h = 14 + rnd() * 58;
      const dark = [pal.city1, pal.city2, pal.city3][(i + (side > 0 ? 1 : 0)) % 3];
      boxMD(md, bx, h / 2, bz, w, h, d, dark);
      winGrid(bx, bz, w, d, h, 'z');
      winGrid(bx, bz, w, d, h, 'x');
      if (h > 44) {
        boxMD(md, bx, h + 2.4, bz, 0.9, 4.8, 0.9, pal.city3);
        pushTriRaw(md, bx - 0.5, h + 4.9, bz - 0.5, bx + 0.5, h + 4.9, bz - 0.5, bx + 0.5, h + 5.6, bz - 0.5, 0xff5a4a);
        pushTriRaw(md, bx - 0.5, h + 4.9, bz - 0.5, bx + 0.5, h + 5.6, bz - 0.5, bx - 0.5, h + 5.6, bz - 0.5, 0xff5a4a);
      }
    }
  }
  /* the low warm city glow band, so the horizon is not a hard cut */
  for (let i = 0; i < 44; i++) {
    const a = i / 44 * TAU, a2 = (i + 1) / 44 * TAU, r = 230, cz = (z0 + z1) / 2;
    pushTriRaw(md, Math.cos(a) * r, 0, cz + Math.sin(a) * r,
      Math.cos(a2) * r, 0, cz + Math.sin(a2) * r,
      Math.cos(a2) * r, 13, cz + Math.sin(a2) * r, pal.glowBand);
    pushTriRaw(md, Math.cos(a) * r, 0, cz + Math.sin(a) * r,
      Math.cos(a2) * r, 13, cz + Math.sin(a2) * r,
      Math.cos(a) * r, 13, cz + Math.sin(a) * r, pal.glowBand);
  }
}
/* the far daylight backdrop for L1/L2 — soft hills / neighbour houses */
function buildFarDay(pal, z0, z1, kind) {
  const md = _farMD;
  const rnd = mkRnd(4242);
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 16; i++) {
      const bx = side * (30 + rnd() * 64);
      const bz = z0 + rnd() * (z1 - z0);
      if (kind === 'hill') {
        domeMD(md, bx, -2, bz, 14 + rnd() * 20, 7 + rnd() * 10, 8, 2, rgb(pal.hill));
      } else {
        const w = 9 + rnd() * 9, h = 6 + rnd() * 5, d = 9 + rnd() * 8;
        boxMD(md, bx, h / 2, bz, w, h, d, rgb(pal.farHouse));
        for (let k = 0; k < 6; k++) {
          const a0 = [bx - w / 2, h, bz - d / 2], a1 = [bx + w / 2, h, bz - d / 2];
          pushTriRaw(md, a0[0], a0[1], a0[2], a1[0], a1[1], a1[2], bx, h + 3.2, bz, rgb(pal.farRoof));
          break;
        }
        domeMD(md, bx + (rnd() - 0.5) * 12, 0, bz + 6, 5 + rnd() * 3, 8 + rnd() * 4, 7, 2, rgb(pal.farTree));
      }
    }
  }
}
