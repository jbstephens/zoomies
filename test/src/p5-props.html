<script>
/* ═══════════════════ ZOOMIES! — p5  world builder + props ══════════════
   The corridor is authored as CHUNK DATA (p6) and this file is the engine
   that turns that data into geometry, collision and spawns.  Laws:

   · geometry is MERGED into 40 m bands — one lit mesh per band, so the
     whole static world in view is ~4 draw calls (LAW: no world-sized
     canvases/textures, bake per band, and measure the bake)
   · static world RECEIVES the shadow map and NEVER casts it
   · emissive faces (lit windows, neon) skip the bake and go in the same
     merged mesh — they are the light source, not a lit surface
   · collision is AABBs bucketed into 4 m z-bins; the cat only ever tests
     the two bins it straddles                                           */

const BAND = 40;                 // metres of corridor per merged mesh
const BINZ = 4;                  // metres of corridor per collision bucket

const WORLD = {
  bands: [], solids: [], bins: [], movers: [], glows: [], corridor: [],
  ceil: [], checkpoints: [], length: 0, far: null, theme: 'house', pal: null,
  bakeMs: 0, tris: 0,
  /* THE BIG OUTSIDE additions.  Every one of these lists is EMPTY for romps
     1–3, and every sim hook that reads them early-outs on an empty list —
     that is what keeps the old levels bit-identical. */
  vents: [],        // updraft columns:   {x, z, r, power, y0, h}
  zips: [],         // ziplines:          {x0,z0,y0, x1,z1,y1, len, g}
  slick: [],        // low-friction floor: {x0,x1,z0,z1, k, cold, on, g}
  says: [],         // PA gags:           {z, main, sub, said}
  props: [],        // dynamic prop meshes to dispose on level clear
  gravK: 1,         // per-level jump gravity scale (LAW: a sim constant)
  /* THE CUCUMBER KING's launch ranks (romp 7).  The LEVEL owns the pad
     geometry; the boss only plants cucumbers on it, so the two can never
     disagree about where the steps are. */
  kingPads: null,
};

function clearWorld() {
  for (const b of WORLD.bands) { scene.remove(b.mesh); b.mesh.geometry.dispose(); }
  if (WORLD.far) { scene.remove(WORLD.far); WORLD.far.geometry.dispose(); }
  /* disposeTree, not .geometry.dispose(): a mover's mesh may be a GROUP now
     (romp 7's yarn planets roll a child inside a positioned parent) and
     `group.geometry` is undefined — which threw on the next level change. */
  for (const m of WORLD.movers) if (m.g) { scene.remove(m.g); disposeTree(m.g); }
  for (const c of WORLD.solids) if (c.g) { scene.remove(c.g); c.g.geometry.dispose(); }
  for (const c of WORLD.checkpoints) if (c.g) { scene.remove(c.g); disposeTree(c.g); }
  WORLD.bands.length = 0; WORLD.solids.length = 0; WORLD.bins.length = 0;
  WORLD.movers.length = 0; WORLD.glows.length = 0; WORLD.corridor.length = 0;
  WORLD.checkpoints.length = 0; WORLD.ceil.length = 0;
  for (const o of WORLD.props) { scene.remove(o); disposeTree(o); }
  WORLD.props.length = 0;
  WORLD.vents.length = 0; WORLD.zips.length = 0;
  WORLD.slick.length = 0; WORLD.says.length = 0;
  WORLD.gravK = 1; WORLD.kingPads = null;
  WORLD.far = null; WORLD.length = 0; WORLD.tris = 0;
  CRATES.length = 0;
}
function disposeTree(o) {
  o.traverse(c => { if (c.isMesh && c.geometry) c.geometry.dispose(); });
}

/* ── the build context ─────────────────────────────────────────────── */
let _mds = null, _farMD = null, _rnd = null, _pal = null;

function bandMD(z) {
  let i = Math.floor(z / BAND);
  if (i < 0) i = 0;
  while (_mds.length <= i) _mds.push(MD());
  return _mds[i];
}
/* geometry only */
function G(cx, cy, cz, sx, sy, sz, c, ry) { boxMD(bandMD(cz), cx, cy, cz, sx, sy, sz, c, ry, false); }
/* emissive geometry (skips the bake) */
function GE(cx, cy, cz, sx, sy, sz, c, ry) { boxMD(bandMD(cz), cx, cy, cz, sx, sy, sz, c, ry, true); }
/* collision only */
function S(cx, cy, cz, sx, sy, sz, kind) {
  WORLD.solids.push({
    x0: cx - sx / 2, x1: cx + sx / 2, y0: cy - sy / 2, y1: cy + sy / 2,
    z0: cz - sz / 2, z1: cz + sz / 2, kind: kind || 'solid', on: true,
    cx, cy, cz, sx, sy, sz,
  });
}
/* geometry + collision */
function B(cx, cy, cz, sx, sy, sz, c, ry, kind) { G(cx, cy, cz, sx, sy, sz, c, ry); S(cx, cy, cz, sx, sy, sz, kind); }
function FLOORQ(x0, z0, x1, z1, y, c) { quadY(bandMD((z0 + z1) / 2), x0, z0, x1, z1, y, c); }
function CYL(cx, cy, cz, rt, rb, h, seg, c) { cylMD(bandMD(cz), cx, cy, cz, rt, rb, h, seg, c); }
function DOME(cx, cy, cz, r, ry2, seg, rings, c) { domeMD(bandMD(cz), cx, cy, cz, r, ry2, seg, rings, c); }
/* a static glow (treats, checkpoints, neon, lamps) — all of them share the
   single instanced additive draw call */
function GLOW(x, y, z, s, hex, pulse) {
  const c = rgb(hex);
  WORLD.glows.push({ x, y, z, s, r: c[0], g: c[1], b: c[2], pulse: pulse || 0 });
}

/* ═══════════════════════ HOUSE props ═══════════════════════════════ */
function propCouch(x, z, ry, P) {
  const seat = 0.46;
  B(x, seat / 2, z, 2.3, seat, 1.05, P.couch, ry);                   // seat block (standable)
  G(x, seat + 0.26, z - 0.42, 2.3, 0.56, 0.22, P.couchD, ry);        // backrest
  S(x, seat + 0.26, z - 0.42, 2.3, 0.56, 0.24, 'solid');
  for (const s of [-1, 1]) {
    G(x + s * 1.06, seat / 2 + 0.16, z, 0.22, seat + 0.32, 1.05, P.couchD, ry);
    S(x + s * 1.06, seat / 2 + 0.16, z, 0.22, seat + 0.32, 1.05, 'solid');
  }
  for (const s of [-0.62, 0.62]) G(x + s, seat + 0.09, z + 0.06, 0.92, 0.18, 0.78, P.cushion, ry);
  for (const s of [[-1, -1], [1, -1], [-1, 1], [1, 1]])
    G(x + s[0] * 1.0, 0.06, z + s[1] * 0.42, 0.14, 0.12, 0.14, P.wood, ry);
}
function propTable(x, z, w, d, h, P) {   // low table: ROLL UNDER it, jump ON it
  B(x, h, z, w, 0.12, d, P.wood);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const lx = x + sx * (w / 2 - 0.14), lz = z + sz * (d / 2 - 0.14);
    G(lx, h / 2, lz, 0.12, h, 0.12, P.woodD);
    S(lx, h / 2, lz, 0.12, h, 0.12, 'solid');
  }
  G(x, h + 0.10, z - d * 0.2, 0.34, 0.08, 0.24, P.book1);            // a magazine on top
}
function propShelf(x, z, ry, h, P) {
  B(x, h / 2, z, 1.5, h, 0.52, P.wood, ry);
  const cols = [P.book1, P.book2, P.book3, P.book4];
  for (let s = 0; s < 3; s++) {
    const sy = 0.42 + s * (h - 0.6) / 3;
    G(x, sy, z, 1.44, 0.05, 0.5, P.woodD, ry);
    for (let i = 0; i < 6; i++) {
      const bw = 0.10 + _rnd() * 0.08, bh = 0.24 + _rnd() * 0.10;
      G(x - 0.6 + i * 0.22, sy + bh / 2 + 0.03, z + 0.02, bw, bh, 0.34, cols[(i + s) % 4], ry);
    }
  }
}
function propCounter(x, z, len, P) {
  B(x, 0.46, z, len, 0.92, 1.0, P.counterD);
  G(x, 0.96, z, len + 0.10, 0.10, 1.10, P.counter);                  // countertop lip
  S(x, 0.96, z, len + 0.10, 0.10, 1.10, 'solid');
  for (let i = 0; i < Math.floor(len / 0.9); i++)
    G(x - len / 2 + 0.45 + i * 0.9, 0.62, z + 0.51, 0.72, 0.5, 0.03, P.counter);
  for (let i = 0; i < Math.floor(len / 0.9); i++)
    G(x - len / 2 + 0.45 + i * 0.9, 0.86, z + 0.53, 0.18, 0.04, 0.04, P.metal);
}
function propFridge(x, z, P) {
  B(x, 1.05, z, 1.05, 2.10, 0.95, P.fridge);
  G(x, 1.36, z + 0.49, 1.00, 1.34, 0.04, P.fridgeD);
  G(x, 0.44, z + 0.49, 1.00, 0.78, 0.04, P.fridgeD);
  G(x + 0.40, 1.36, z + 0.53, 0.06, 0.66, 0.06, P.metal);
  G(x + 0.40, 0.52, z + 0.53, 0.06, 0.40, 0.06, P.metal);
  for (let i = 0; i < 4; i++)                                        // fridge magnets + kid art
    G(x - 0.32 + i * 0.22, 1.70 - (i % 2) * 0.16, z + 0.50, 0.11, 0.11, 0.03,
      [P.rug, P.book2, P.plantL, P.book4][i]);
}
function propRug(x, z, w, d, P) {
  FLOORQ(x - w / 2, z - d / 2, x + w / 2, z + d / 2, 0.012, P.rug);
  FLOORQ(x - w / 2 + 0.24, z - d / 2 + 0.24, x + w / 2 - 0.24, z + d / 2 - 0.24, 0.016, P.rug2);
}
function propLamp(x, z, P) {
  G(x, 0.03, z, 0.40, 0.06, 0.40, P.woodD);
  CYL(x, 0.75, z, 0.035, 0.045, 1.44, 6, P.metal);
  const md = bandMD(z);
  cylMD(md, x, 1.63, z, 0.24, 0.34, 0.36, 8, rgb(P.shade));
  GE(x, 1.47, z, 0.42, 0.04, 0.42, P.lampLit);
  GLOW(x, 1.55, z, 2.5, P.lampGlow, 0.4);
  S(x, 0.7, z, 0.34, 1.4, 0.34, 'solid');
}
function propPlant(x, z, P) {
  CYL(x, 0.22, z, 0.24, 0.19, 0.44, 7, P.pot);
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU, r = 0.18 + _rnd() * 0.1;
    const h = 0.5 + _rnd() * 0.55;
    G(x + Math.cos(a) * r, 0.44 + h / 2, z + Math.sin(a) * r, 0.09, h, 0.16,
      i % 2 ? P.plantL : P.plantD, a);
  }
  S(x, 0.45, z, 0.5, 0.9, 0.5, 'solid');
}
/* BREAKABLE crate — scratch / roll / pounce / zoomies pops it, so unlike
   every other prop its geometry canNOT live in the merged band mesh.  It
   gets its own little mesh (distance-culled) and a 'crate' solid. */
const CRATES = [];
function propCrate(x, y, z, s, P) {
  const e = s * 0.92, t = s * 0.09;
  const m = vcMesh([
    vcBox(s, s, s, P.crate),
    vcBox(e, t, s + 0.012, P.crateD),
    vcBox(t, e, s + 0.012, P.crateD),
    vcBox(s + 0.012, t, e, P.crateD),
    vcBox(s + 0.012, e, t, P.crateD),
    vcBox(e, s + 0.012, t, P.crateD),
  ]);
  twFace(m, x, y + s / 2, z, 0);
  if (LOOK && FX.shadow) m.castShadow = true;
  scene.add(m);
  const sol = { x0: x - s / 2, x1: x + s / 2, y0: y, y1: y + s, z0: z - s / 2, z1: z + s / 2,
    kind: 'crate', on: true, cx: x, cy: y + s / 2, cz: z, sx: s, sy: s, sz: s,
    g: m, col: P.crate, colD: P.crateD };
  WORLD.solids.push(sol);
  CRATES.push(sol);
}
/* The opening is deliberately TALLER than the camera boom (cat.y + 2.55) and
   wider than the cat's lane: a low lintel put the header right in the lens
   every time he ran through a door, which read as the screen going blank. */
function propDoorway(x, z, P) {
  for (const sg of [-1, 1]) {
    G(x + sg * 3.45, 1.50, z, 2.5, 3.00, 0.34, P.wallLow);
    S(x + sg * 3.45, 1.50, z, 2.5, 3.00, 0.34, 'solid');
    G(x + sg * 2.28, 1.50, z, 0.16, 3.00, 0.42, P.trim);
  }
  G(x, 3.10, z, 9.0, 0.22, 0.38, P.wallLow);
  G(x, 3.05, z, 4.8, 0.14, 0.44, P.trim);
}
/* A window is always ON a side wall, facing into the corridor.  It throws a
   warm unlit floor patch inward and registers one soft glow — the honey
   light the house level is made of. */
function propWindow(x, y, z, w, h, P) {
  const s = x < 0 ? 1 : -1;                    // inward direction (+x or -x)
  const ry = Math.PI / 2;
  G(x, y, z, w + 0.24, h + 0.24, 0.10, P.trim, ry);
  GE(x + s * 0.06, y, z, w, h, 0.05, P.winLit, ry);
  G(x + s * 0.09, y, z, 0.03, h, 0.07, P.trim, ry);
  G(x + s * 0.09, y, z, 0.03, 0.07, w, P.trim, ry);
  GLOW(x + s * 0.6, y, z, Math.max(w, h) * 2.0, P.winGlow, 0);
  /* the warm shaft on the floor: a flat unlit quad leaning down-corridor */
  const md = bandMD(z);
  const yb = 0.02, c = rgb(P.sunPatch);
  const nx = x + s * 0.2, fx = x + s * 3.4;
  pushTriRaw(md, nx, yb, z - w / 2 - 0.3, nx, yb, z + w / 2 + 0.3, fx, yb, z + w / 2 + 1.9, c);
  pushTriRaw(md, nx, yb, z - w / 2 - 0.3, fx, yb, z + w / 2 + 1.9, fx, yb, z - w / 2 + 1.1, c);
}
function propCatTree(x, z, P) {
  G(x, 0.06, z, 0.9, 0.12, 0.9, P.woodD);
  CYL(x, 0.8, z, 0.14, 0.16, 1.4, 7, P.catpost);
  B(x, 1.54, z, 0.86, 0.14, 0.86, P.cushion);
  CYL(x + 0.02, 1.9, z, 0.12, 0.13, 0.62, 7, P.catpost);
  B(x, 2.28, z, 0.72, 0.14, 0.72, P.cushion);
}

/* ═══════════════════════ YARD props ════════════════════════════════ */
function propFenceRun(x, z0, z1, P) {
  for (let z = z0; z < z1; z += 2.0) {
    G(x, 0.62, z, 0.14, 1.24, 0.14, P.fenceD);
    S(x, 0.62, z, 0.16, 1.24, 0.16, 'solid');
  }
  G(x, 0.72, (z0 + z1) / 2, 0.06, 0.16, z1 - z0, P.fence);
  G(x, 0.36, (z0 + z1) / 2, 0.06, 0.16, z1 - z0, P.fence);
  for (let z = z0; z < z1; z += 0.34) G(x, 0.62, z, 0.05, 1.20, 0.26, P.fence);
  S(x, 1.4, (z0 + z1) / 2, 0.2, 1.4, z1 - z0, 'solid');
}
function propFenceTop(x, z0, z1, y, P) {   // the balance run — a walkable rail
  B(x, y, (z0 + z1) / 2, 0.52, 0.16, z1 - z0, P.fence);
  for (let z = z0 + 1; z < z1; z += 2.4) {
    G(x, (y - 0.08) / 2, z, 0.16, y - 0.08, 0.16, P.fenceD);
    S(x, (y - 0.08) / 2, z, 0.18, y - 0.08, 0.18, 'solid');
  }
  for (let z = z0; z < z1; z += 0.34) G(x, (y - 0.08) * 0.55, z, 0.06, y * 0.9, 0.26, P.fence);
}
function propBush(x, z, r, P) {
  /* taller than wide, in three lumps — a flat wide dome reads as an
     umbrella, not a shrub */
  DOME(x, 0.02, z, r * 0.86, r * 1.35, 7, 3, P.bush);
  DOME(x - r * 0.52, 0.02, z - r * 0.22, r * 0.60, r * 0.95, 6, 2, P.bushD);
  DOME(x + r * 0.54, 0.02, z + r * 0.30, r * 0.56, r * 0.88, 6, 2, P.bushD);
  S(x, r * 0.4, z, r * 1.7, r * 0.8, r * 1.7, 'solid');
}
function propTree(x, z, h, P) {
  CYL(x, h * 0.34, z, 0.17, 0.26, h * 0.68, 7, P.bark);
  DOME(x, h * 0.62, z, h * 0.44, h * 0.46, 8, 3, rgb(P.leaf));
  DOME(x - h * 0.2, h * 0.52, z + h * 0.12, h * 0.3, h * 0.3, 7, 2, rgb(P.leafD));
  DOME(x + h * 0.22, h * 0.56, z - h * 0.1, h * 0.28, h * 0.3, 7, 2, rgb(P.leafD));
  S(x, h * 0.34, z, 0.5, h * 0.68, 0.5, 'solid');
}
function propPlanterRow(x, z, len, P) {
  B(x, 0.20, z, 2.0, 0.40, len, P.dirt);
  G(x, 0.44, z, 2.10, 0.12, len + 0.10, P.plank);
  S(x, 0.44, z, 2.10, 0.12, len + 0.10, 'solid');
  for (let i = 0; i < len / 0.8; i++) {
    const zz = z - len / 2 + 0.4 + i * 0.8;
    for (const sx of [-0.5, 0.5]) {
      G(x + sx, 0.62, zz, 0.10, 0.34, 0.10, P.stem);
      DOME(x + sx, 0.76, zz, 0.22, 0.22, 6, 2, rgb(i % 2 ? P.leaf : P.leafD));
    }
  }
}
/* The deck's walking surface comes from the level's own floor op (one
   emitter per surface — two would z-fight).  This adds the fascia and the
   rails that make it read as a porch. */
function propDeck(x, z0, z1, w, y, P) {
  for (const sx of [-1, 1]) G(x + sx * (w / 2 + 0.02), y - 0.28, (z0 + z1) / 2, 0.14, 0.56, z1 - z0, P.railD);
  G(x, y - 0.28, z1 + 0.02, w + 0.3, 0.56, 0.14, P.railD);
  for (const sx of [-1, 1]) {
    G(x + sx * (w / 2 + 0.06), y + 0.46, (z0 + z1) / 2, 0.10, 0.90, z1 - z0, P.rail);
    S(x + sx * (w / 2 + 0.06), y + 0.46, (z0 + z1) / 2, 0.12, 0.90, z1 - z0, 'solid');
    for (let z = z0; z < z1; z += 1.2) G(x + sx * (w / 2 + 0.06), y + 0.30, z, 0.12, 0.60, 0.12, P.railD);
  }
}
function propBirdbath(x, z, P) {
  CYL(x, 0.10, z, 0.34, 0.46, 0.20, 8, P.stone);
  CYL(x, 0.52, z, 0.16, 0.20, 0.72, 8, P.stone);
  CYL(x, 0.94, z, 0.58, 0.40, 0.18, 10, P.stoneD);
  const md = bandMD(z);
  cylMD(md, x, 1.02, z, 0.52, 0.52, 0.02, 10, rgb(P.water));
  GLOW(x, 1.06, z, 1.2, P.waterGlow, 0.7);
  /* the pedestal stops SHORT of the rim so the bowl is unambiguously the
     top surface — the rim is the trampoline */
  S(x, 0.46, z, 0.5, 0.92, 0.5, 'solid');
  S(x, 1.00, z, 1.20, 0.14, 1.20, 'tramp');
}
/* Roof built from two ROTATED SLABS rather than raw gable triangles — the
   hand-wound tris came out backface-culled from the player's side and the
   roof read as two dark flaps.  Slabs are always wound correctly. */
function propDoghouse(x, z, ry, P) {
  const cs = Math.cos(ry), sn = Math.sin(ry);
  B(x, 0.55, z, 1.9, 1.10, 1.7, P.dog1, ry);
  const md = bandMD(z);
  for (const sg of [-1, 1]) {
    /* each roof plane: a slab tilted about the ridge axis (local X) */
    const tilt = sg * 0.62;
    const cx = x + sn * (sg * 0.50), cz = z + cs * (sg * 0.50);
    const rx = Math.cos(tilt), ry2 = Math.sin(tilt);
    const hx = 1.12, hy = 0.09, hz = 0.72;
    const P8 = [];
    for (let i = 0; i < 8; i++) {
      const lx = (i & 1) ? hx : -hx, ly = (i & 2) ? hy : -hy, lz = (i & 4) ? hz : -hz;
      /* tilt about local X, then yaw by ry */
      const ty = ly * rx - lz * ry2, tz = ly * ry2 + lz * rx;
      P8.push([cx + lx * cs + tz * sn, 1.40 + ty, cz - lx * sn + tz * cs]);
    }
    const F = [[0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4], [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]];
    for (const f of F) {
      const A = P8[f[0]], Bv = P8[f[1]], C = P8[f[2]], D = P8[f[3]];
      pushTri(md, A[0], A[1], A[2], Bv[0], Bv[1], Bv[2], C[0], C[1], C[2], P.dog2);
      pushTri(md, A[0], A[1], A[2], C[0], C[1], C[2], D[0], D[1], D[2], P.dog2);
    }
  }
  /* the arched doorway, always on the side the cat approaches from */
  G(x - sn * 0.88, 0.44, z - cs * 0.88, 0.78, 0.88, 0.10, 0x241616, ry);
  G(x - sn * 0.90, 0.92, z - cs * 0.90, 0.86, 0.14, 0.12, P.dog2, ry);
  /* a name board, because he is a good boy */
  G(x - sn * 0.92, 1.14, z - cs * 0.92, 0.96, 0.24, 0.08, 0xf2e2c0, ry);
  /* LAW (Rex fight): the roof is a TRAMPOLINE */
  S(x, 1.46, z, 2.1, 0.5, 1.8, 'tramp');
}
function propHose(x, z, P) {
  for (let i = 0; i < 26; i++) {
    const a = i * 0.62, r = 0.5 + i * 0.026;
    G(x + Math.cos(a) * r, 0.05, z + Math.sin(a) * r * 0.7, 0.16, 0.10, 0.16, P.hose);
  }
}
function propShed(x, z, P) {
  B(x, 1.25, z, 3.4, 2.5, 2.6, P.shed);
  G(x, 2.62, z, 3.7, 0.26, 2.9, P.shedD);

/* the night skyline: ONE unlit merged mesh far behind, lit windows and all.
   fog:false so it stays crisp against the indigo dome — this is the vista. */
function buildSkyline(pal, z0, z1) {
  const md = _farMD;
  const rnd = mkRnd(90210);
  /* windows: a grid of little unlit quads on the face that is actually
     turned toward the player.  This is the whole reason the night level
     exists, so both the down-corridor face AND the inward side get them. */
  function winGrid(bx, bz, w, d, h, face) {
    const rows = Math.floor((h - 4) / 4.2), cols = Math.floor((face === 'z' ? w : d) / 3.4);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (rnd() > 0.52) continue;
      const wy = 3.4 + r * 4.2;
      if (wy > h - 2.2) continue;
      const lit = rnd() > 0.34 ? pal.winA : pal.winB;
      const hw = 0.85, hh = 1.15;
      if (face === 'z') {
        const wx = bx - w / 2 + 1.7 + c * 3.4, zf = bz - d / 2 - 0.06;
        pushTriRaw(md, wx - hw, wy - hh, zf, wx + hw, wy - hh, zf, wx + hw, wy + hh, zf, lit);
        pushTriRaw(md, wx - hw, wy - hh, zf, wx + hw, wy + hh, zf, wx - hw, wy + hh, zf, lit);
      } else {
        const wz = bz - d / 2 + 1.7 + c * 3.4, xf = bx + (bx < 0 ? w / 2 + 0.06 : -w / 2 - 0.06);
        pushTriRaw(md, xf, wy - hh, wz - hw, xf, wy - hh, wz + hw, xf, wy + hh, wz + hw, lit);
        pushTriRaw(md, xf, wy - hh, wz - hw, xf, wy + hh, wz + hw, xf, wy + hh, wz - hw, lit);
      }
    }
  }
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 22; i++) {
      /* pushed well out: at 34 m they towered over the rooftop and ate the
         frame; the vista wants distance, not scale */
      const bx = side * (58 + rnd() * 150);
      const bz = z0 + rnd() * (z1 - z0);
      const w = 13 + rnd() * 22, d = 13 + rnd() * 20, h = 14 + rnd() * 58;
      const dark = [pal.city1, pal.city2, pal.city3][(i + (side > 0 ? 1 : 0)) % 3];
      boxMD(md, bx, h / 2, bz, w, h, d, dark);
      winGrid(bx, bz, w, d, h, 'z');
      winGrid(bx, bz, w, d, h, 'x');
      if (h > 44) {
        boxMD(md, bx, h + 2.4, bz, 0.9, 4.8, 0.9, pal.city3);
        pushTriRaw(md, bx - 0.5, h + 4.9, bz - 0.5, bx + 0.5, h + 4.9, bz - 0.5, bx + 0.5, h + 5.6, bz - 0.5, 0xff5a4a);
        pushTriRaw(md, bx - 0.5, h + 4.9, bz - 0.5, bx + 0.5, h + 5.6, bz - 0.5, bx - 0.5, h + 5.6, bz - 0.5, 0xff5a4a);
      }
    }
  }
  /* the low warm city glow band, so the horizon is not a hard cut */
  for (let i = 0; i < 44; i++) {
    const a = i / 44 * TAU, a2 = (i + 1) / 44 * TAU, r = 230, cz = (z0 + z1) / 2;
    pushTriRaw(md, Math.cos(a) * r, 0, cz + Math.sin(a) * r,
      Math.cos(a2) * r, 0, cz + Math.sin(a2) * r,
      Math.cos(a2) * r, 13, cz + Math.sin(a2) * r, pal.glowBand);
    pushTriRaw(md, Math.cos(a) * r, 0, cz + Math.sin(a) * r,
      Math.cos(a2) * r, 13, cz + Math.sin(a2) * r,
      Math.cos(a) * r, 13, cz + Math.sin(a) * r, pal.glowBand);
  }
}

    GE(x + sg * 3.7, 1.90, z - 0.16, 2.2, 1.9, 0.04, P.signA);
  }
  G(x, 3.34, z, 9.6, 0.30, 0.42, P.shelfD);
  G(x, 3.30, z, 5.2, 0.16, 0.48, P.signB);
}
/* a WET FLOOR cone — deco along the arena, and SIR MOPSALOT's hat */
function buildCone(P) {
  return vcMesh([
    vcBox(0.46, 0.05, 0.46, P.coneD).translate(0, 0.025, 0),
    vcCone(0.20, 0.62, 4, P.cone).translate(0, 0.35, 0),
    vcBox(0.30, 0.09, 0.02, P.coneD).translate(0, 0.30, 0.13),
  ]);
}
function propCone(x, z, ry, P) {
  const m = buildCone(P);
  twFace(m, x, 0, z, ry || 0);
  scene.add(m);
  WORLD.props.push(m);
}
/* a mopped slick (the freezer's frost sheen and the boss's puddles): one
   flat translucent quad, no depth write, so it never z-fights the floor */
function makePuddle(w, d, hex) {
  const g = new THREE.PlaneGeometry(w, d);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: hex, transparent: true, opacity: 0.34, depthWrite: false,
  }));
  /* YXZ so the route heading (rotation.y) is applied BEFORE the lie-flat
     tilt — with the default XYZ order a yaw would spin the quad on edge */
  m.rotation.order = 'YXZ';
  m.rotation.x = -Math.PI / 2;
  m.renderOrder = 3;
  scene.add(m);
  WORLD.props.push(m);
  return m;
}

/* ═══════════ GREENHOUSE props (romp 5) ══════════════════════════════════
   LEVELS2 §B.  The vertical one: leaf trampolines, terracotta pot stacks you
   climb, slatted staging benches you run along, ferns and palms for the
   jungle, and hanging vines.  All authored in TRACK space like everything
   else — pushTri bends them round the two switchback corners for free. */

/* a GIANT LEAF — the trampoline of this level.  Flattened dome + a mid-rib
   so it reads as a leaf and not as a green plate, and a `tramp` solid. */
function propLeafTramp(x, y, z, r, P) {
  const md = bandMD(z);
  domeMD(md, x, y - 0.06, z, r, r * 0.30, 9, 2, rgb(P.leafBig));
  domeMD(md, x, y - 0.14, z, r * 0.72, r * 0.16, 8, 1, rgb(P.leafBigD));
  G(x, y + 0.04, z, r * 0.10, 0.05, r * 1.7, P.leafBigD);          // mid rib
  for (let i = 0; i < 5; i++) {
    const a = (i - 2) * 0.38;
    G(x, y + 0.02, z, r * 1.5, 0.04, r * 0.06, P.leafBigD, a);     // side veins
  }
  /* the stem reaches down toward the floor so it is obviously a PLANT and not
     a floating disc (deco only — the solid is the leaf) */
  CYL(x - r * 0.9, y - 0.5, z, 0.07, 0.10, 1.0, 6, P.stem);
  S(x, y - 0.14, z, r * 1.7, 0.34, r * 1.7, 'tramp');
}
/* A LEANING stack of terracotta pots — and it leans for a REASON.  Stacked
   dead vertical it is not climbable at all: each pot's rim (and the lid, which
   is wider than the pot under it) overhangs the ledge below, so a cat standing
   on pot 2 bonks his head on the lid on the way up and drops straight back.
   Offsetting each pot along the route turns the stack into a THREE-STEP
   STAIRCASE with nothing overhead — which is what it always looked like it
   was, and now is.  (Found by the bot, romp 5.) */
function propPotStack(x, z, n, P) {
  let y = 0, zz = z;
  for (let i = 0; i < n; i++) {
    const rr = 0.46 - i * 0.05, h = 0.54;
    zz = z + i * 0.40;
    CYL(x, y + h / 2, zz, rr, rr * 0.78, h, 9, P.terra);
    CYL(x, y + h - 0.03, zz, rr + 0.05, rr + 0.05, 0.08, 9, P.terraD);
    S(x, y + h / 2, zz, rr * 1.9, h, rr * 1.9, 'solid');
    y += h;
  }
  /* a flat lid on top so the stack is a LEDGE, not a dome you slide off — and
     no wider than the pot it sits on, or it becomes a low ceiling */
  B(x, y + 0.04, zz, 0.66, 0.10, 0.66, P.terraD);
  return y + 0.09;
}
/* a slatted greenhouse staging bench — a walkable runway at `y` */
function propStage(x, z, len, w, y, P) {
  B(x, y - 0.05, z, w, 0.10, len, P.bench);
  for (let zz = z - len / 2 + 0.3; zz < z + len / 2; zz += 0.42)
    G(x, y + 0.02, zz, w - 0.06, 0.04, 0.22, P.benchD);
  for (let zz = z - len / 2 + 0.8; zz < z + len / 2; zz += 2.6) {
    for (const sx of [-1, 1]) {
      G(x + sx * (w / 2 - 0.16), (y - 0.1) / 2, zz, 0.12, y - 0.1, 0.12, P.benchD);
      S(x + sx * (w / 2 - 0.16), (y - 0.1) / 2, zz, 0.14, y - 0.1, 0.14, 'solid');
    }
  }
  G(x, y + 0.10, z, w + 0.10, 0.10, 0.10, P.benchD);
}
function propFern(x, z, s, P) {
  CYL(x, 0.12, z, 0.16, 0.20, 0.24, 7, P.terra);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * TAU, lift = 0.5 + (i % 3) * 0.18;
    G(x + Math.cos(a) * s * 0.42, 0.24 + lift * s * 0.5, z + Math.sin(a) * s * 0.42,
      s * 0.16, s * lift, s * 0.9, i % 2 ? P.leaf : P.leafD, a);
  }
  S(x, s * 0.4, z, s * 1.2, s * 0.8, s * 1.2, 'solid');
}
function propPalm(x, z, h, P) {
  for (let i = 0; i < 5; i++)
    CYL(x + Math.sin(i * 0.7) * 0.10, h * 0.11 + i * h * 0.17, z, 0.15, 0.20, h * 0.19, 7, P.bark);
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU;
    G(x + Math.cos(a) * h * 0.30, h * 0.93 - (i % 2) * 0.18, z + Math.sin(a) * h * 0.30,
      h * 0.18, 0.10, h * 0.66, i % 2 ? P.leafBig : P.leafBigD, a);
  }
  DOME(x, h * 0.95, z, h * 0.12, h * 0.10, 7, 2, rgb(P.leafBigD));
  S(x, h * 0.45, z, 0.54, h * 0.9, 0.54, 'solid');
}
/* hanging vines — pure deco, and the thing that makes a tall glass room read
   as a JUNGLE instead of as a corridor with a high ceiling */
function propVine(x, y, z, h, P) {
  const md = bandMD(z);
  const n = Math.max(3, Math.round(h / 0.6));
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const sw = Math.sin(t * 5.2) * 0.22;
    boxMD(md, x + sw, y - t * h - 0.3, z + Math.cos(t * 4.1) * 0.14, 0.07, 0.62, 0.07, rgb(P.vine));
    if (i % 2 === 0)
      boxMD(md, x + sw + 0.16, y - t * h - 0.3, z + Math.cos(t * 4.1) * 0.14, 0.30, 0.06, 0.22,
        rgb(i % 4 ? P.leaf : P.leafD), t * 3);
  }
}
/* the flower bed the QUEEN BEE holds court over */
function propFlowerBed(x, z, len, w, P) {
  B(x, 0.16, z, w, 0.32, len, P.soil);
  G(x, 0.36, z, w + 0.14, 0.12, len + 0.14, P.terraD);
  S(x, 0.36, z, w + 0.14, 0.12, len + 0.14, 'solid');
  const fc = [P.flower1, P.flower2, P.flower3];
  let i = 0;
  for (let zz = z - len / 2 + 0.6; zz < z + len / 2; zz += 1.1, i++) {
    for (const sx of [-0.30, 0.30]) {
      const xx = x + sx * w;
      CYL(xx, 0.62, zz, 0.05, 0.06, 0.44, 5, P.stem);
      const c = fc[(i + (sx > 0 ? 1 : 0)) % 3];
      for (let k = 0; k < 5; k++) {
        const a = k / 5 * TAU;
        G(xx + Math.cos(a) * 0.17, 0.86, zz + Math.sin(a) * 0.17, 0.20, 0.06, 0.13, c, a);
      }
      CYL(xx, 0.88, zz, 0.09, 0.09, 0.07, 6, P.signA);
      GLOW(xx, 0.95, zz, 0.9, c, 0.5);
    }
  }
}
/* a glass pane panel — the greenhouse wall style's building block */
function propGlassPanel(x, y, z, w, h, sideAxis, P) {
  if (sideAxis) {
    G(x, y, z, 0.16, h, w, P.glassFrame);
    GE(x, y, z, 0.05, h - 0.26, w - 0.26, P.glass);
  } else {
    G(x, y, z, w, h, 0.16, P.glassFrame);
    GE(x, y, z - 0.06, w - 0.26, h - 0.26, 0.05, P.glass);

}

/* ═══════════ SKYLINE-DAY props (romp 6) ═════════════════════════════════
   The same rooftop vocabulary as romp 3 (parapets, AC units, chimneys,
   antennas, awnings, the water tower) in a DAY palette, plus the four things
   the Spider-Man level needs of its own: a skyscraper to bend around, tower
   cranes, window-washer rigs and kites. */

/* a whole skyscraper, SOLID: this is what the CORNER bends around, so it is
   the one prop in the game that is a building rather than a piece of one */
function propTowerBlock(x, z, w, d, h, P) {
  B(x, h / 2, z, w, h, d, P.concA);
  G(x, h + 0.30, z, w + 0.5, 0.60, d + 0.5, P.concB);            // the cap
  G(x, h + 0.80, z, w * 0.36, 0.44, d * 0.36, P.metalD);
  /* glass bands: horizontal ribbons on BOTH faces that meet at the corner, so
     whichever side of the bend you are on it reads as a tower */
  for (let yy = 2.2; yy < h - 1.2; yy += 3.1) {
    for (const sg of [-1, 1]) {
      G(x + sg * (w / 2 + 0.05), yy, z, 0.12, 1.5, d - 1.0, P.glassD);
      G(x, yy, z + sg * (d / 2 + 0.05), w - 1.0, 1.5, 0.12, P.glassD);
      G(x + sg * (w / 2 + 0.10), yy + 0.92, z, 0.10, 0.22, d - 1.0, P.goldTrim);
    }
  }
}
/* a tower crane: mast, jib, counter-jib, hook.  The PLATFORM the cat rides is
   a `mover` in the level data; this is the machine it hangs from. */
function propCrane(x, z, h, P) {
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    G(x + sx * 0.52, h / 2, z + sz * 0.52, 0.16, h, 0.16, P.craneA);
  }
  for (let yy = 1.6; yy < h; yy += 1.6) {
    G(x, yy, z, 1.24, 0.12, 0.12, P.craneD);
    G(x, yy, z, 0.12, 0.12, 1.24, P.craneD);
  }
  S(x, h / 2, z, 1.3, h, 1.3, 'solid');
  /* the jib reaches OUT over the corridor (deco — nothing to stand on up there) */
  const jx = x < 0 ? 1 : -1;
  for (let i = 0; i < 9; i++) {
    G(x + jx * (1.2 + i * 1.5), h + 0.7, z, 1.5, 0.14, 0.14, P.craneA);
    G(x + jx * (1.2 + i * 1.5), h + 1.3, z, 1.5, 0.12, 0.12, P.craneD);
    G(x + jx * (1.2 + i * 1.5), h + 1.0, z, 0.10, 0.70, 0.10, P.craneD);
  }
  G(x - jx * 1.8, h + 0.9, z, 2.4, 0.9, 1.0, P.craneD);           // counterweight
  G(x + jx * 6.0, h - 1.4, z, 0.07, 3.0, 0.07, P.metalD);         // the cable
  G(x + jx * 6.0, h - 3.1, z, 0.44, 0.40, 0.44, P.metalD);        // the hook block
  GE(x, h + 1.9, z, 0.18, 0.18, 0.18, 0xff5a4a);
  GLOW(x, h + 1.95, z, 1.0, 0xff5a4a, 1.5);
}
/* the davit + cables a window-washer platform hangs from (the platform itself
   is a vertical `mover`).  Deco only: a solid here would block the ride. */
function propWasherRig(x, y, z, w, P) {
  for (const sx of [-1, 1]) G(x + sx * (w / 2 - 0.2), y + 3.2, z, 0.07, 6.4, 0.07, P.metalD);
  G(x, y + 6.5, z, w + 0.6, 0.18, 0.5, P.metalD);
  G(x, y + 6.2, z - 0.3, 0.4, 0.5, 0.4, P.craneD);
  G(x, y + 0.3, z, w, 0.10, 0.12, P.signA);
}
/* a kite — high, bright, and the thing that sells "daytime" in one glance */
function propKite(x, y, z, hex, P) {
  const md = bandMD(z);
  const a = 0.5, c = rgb(hex), c2 = rgb(P.panel);
  /* two triangles make the diamond, wound so both are front-facing */
  pushTriRaw(md, x, y + 1.1, z, x - 0.8, y, z + 0.2, x + 0.8, y, z - 0.2, c);
  pushTriRaw(md, x, y - 1.3, z, x - 0.8, y, z + 0.2, x + 0.8, y, z - 0.2, c2);
  for (let i = 0; i < 6; i++)
    boxMD(md, x + Math.sin(i * 1.1) * 0.5, y - 1.6 - i * 0.7, z + Math.cos(i * 0.8) * 0.4,
      0.22, 0.30, 0.05, i % 2 ? c : c2, i * 0.6, true);
  void a;
}

/* ═══════════ DREAM props (romp 7) ═══════════════════════════════════════
   Cotton-candy pastels over the indigo void.  The floating islands ARE floor
   ops (one emitter per surface — house law); these add the soft underside,
   the tufts and the clouds that make them read as CUSHIONS. */
function propCushionIsle(x, z, w, d, y, P) {
  /* The plump underside.  A dome with a NEGATIVE height would be wound
     inside-out (and backface-culled into nothing), so the hanging belly is a
     tapered CYL instead — wide at the slab, narrow underneath. */
  const r = Math.min(w, d) * 0.48;
  CYL(x, y - 0.42, z, r, r * 0.34, 0.84, 11, P.cush2);
  for (const sg of [-1, 1]) {
    G(x + sg * (w / 2 - 0.1), y - 0.16, z, 0.36, 0.36, d - 0.4, P.cush1);
    G(x, y - 0.16, z + sg * (d / 2 - 0.1), w - 0.4, 0.36, 0.36, P.cush1);
  }
  /* tuft buttons on top — flat, so they are never a trip hazard */
  for (let i = -1; i <= 1; i++) for (let k = -1; k <= 1; k++) {
    if (!i && !k) continue;
    CYL(x + i * w * 0.28, y + 0.03, z + k * d * 0.28, 0.16, 0.16, 0.06, 7, P.cush3);
  }
}
/* a giant ball of yarn — romp 7's rolling mover.  Returns a MESH (the mover
   machinery spins it), not baked geometry. */
function mkYarnBall(r, P) {
  const parts = [vcSph(r, 12, 9, P.yarn1)];
  for (let i = 0; i < 7; i++) {
    parts.push(vcCyl(r * 1.02, r * 1.02, r * 0.16, 14, P.yarn2, true)
      .rotateX(Math.PI / 2 + i * 0.41).rotateY(i * 0.73));
  }
  parts.push(vcCyl(r * 0.05, r * 0.05, r * 1.6, 5, P.yarn2).rotateZ(1.1).translate(r * 0.9, r * 0.6, 0));
  return vcMesh(parts);
}
/* a sparkle vent: the dream's version of the market's floor grate */
function propSparkleRing(x, z, r, P, y) {
  const b = y || 0;
  FLOORQ(x - r, z - r, x + r, z + r, b + 0.018, P.cush2);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * TAU;
    G(x + Math.cos(a) * r * 0.78, b + 0.10, z + Math.sin(a) * r * 0.78, 0.22, 0.16, 0.22, P.star, a);
  }
  CYL(x, b + 0.05, z, r * 0.52, r * 0.62, 0.10, 10, P.cush3);
  GLOW(x, b + 1.10, z, 3.0, P.star, 1.1);
  GLOW(x, b + 2.80, z, 2.2, P.cush3, 0.8);
}
/* pastel clouds.  EMISSIVE (unlit) domes: the first pass baked them, and a
   lit dome seen from below shades to 0.60 with a cool tint — every cloud in
   the dream came out as a dark purple umbrella.  Flat and wide, too: a tall
   dome reads as a hill, and this level has no hills. */
function propCloud(x, y, z, s, P) {
  const md = bandMD(z);
  const c = rgb(P.cloud), c2 = rgb(P.cush1);
  domeMD(md, x, y, z, s, s * 0.34, 10, 2, c, true);
  domeMD(md, x - s * 0.78, y - 0.14, z + s * 0.26, s * 0.64, s * 0.26, 9, 2, c, true);
  domeMD(md, x + s * 0.80, y - 0.16, z - s * 0.22, s * 0.60, s * 0.24, 9, 2, c, true);
  domeMD(md, x + s * 0.14, y + s * 0.18, z - s * 0.30, s * 0.52, s * 0.26, 9, 2, c, true);
  /* a soft underside so it is not a paper cut-out from below */
  domeMD(md, x, y - 0.02, z, s * 0.96, -0.001, 10, 1, c2, true);
}
/* a CANOPY cluster — leaf domes with no solid, purely to put foliage in the
   air.  Romp 5's canopy walk was a set of planks floating in a glass box
   until these went in: a canopy walk needs a canopy. */
function propCanopy(x, y, z, s, P) {
  const md = bandMD(z);
  const a = rgb(P.leafBig), b = rgb(P.leafBigD), d = rgb(P.leaf);
  domeMD(md, x, y, z, s, s * 0.46, 9, 2, a);
  domeMD(md, x - s * 0.72, y - s * 0.14, z + s * 0.30, s * 0.62, s * 0.38, 8, 2, b);
  domeMD(md, x + s * 0.74, y - s * 0.16, z - s * 0.26, s * 0.58, s * 0.34, 8, 2, d);
  domeMD(md, x + s * 0.10, y + s * 0.22, z - s * 0.34, s * 0.50, s * 0.30, 8, 2, a);
  /* a few leaf blades poking out of the mass, so the silhouette is not a ball */
  for (let i = 0; i < 6; i++) {
    const ang = i / 6 * TAU;
    G(x + Math.cos(ang) * s * 0.92, y + s * 0.10, z + Math.sin(ang) * s * 0.92,
      s * 0.82, 0.10, s * 0.26, i % 2 ? P.leafBig : P.leaf, ang);
  }
}
/* the dream's throne column: a pastel plinth under the CUCUMBER KING's
   platform, so his arena reads as a throne room and not as a floating box */
function propThroneColumn(x, z, h, P) {
  CYL(x, h * 0.5, z, 1.10, 1.45, h, 12, P.throneD);
  for (let yy = 1.6; yy < h; yy += 2.2) CYL(x, yy, z, 1.55, 1.55, 0.22, 12, P.throne);
  DOME(x, h * 0.5, z, 1.7, 0.9, 12, 2, rgb(P.throne));
  S(x, h * 0.5, z, 2.4, h, 2.4, 'solid');
  GLOW(x, h + 0.7, z, 1.6, P.cush1, 0.6);
}

/* the DAY skyline (romp 6).  Romp 3's night skyline pushes its towers out to
   fixed ±X, which only works on a straight level; romp 6 TURNS, so the towers
   are scattered over the route's WORLD footprint and any that land on the
   route itself are rejected against the sampled centre line.  One unlit
   merged mesh, fog:false, exactly like the night one. */
function buildSkylineDay(pal, len) {
  const md = _farMD;
  const rnd = mkRnd(60613);
  const path = [];
  for (let d = -70; d < len + 90; d += 6) {
    twMap(d, 0, 0, _tw2);
    path.push([_tw2[0], _tw2[2]]);
  }
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const p of path) {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < z0) z0 = p[1];
    if (p[1] > z1) z1 = p[1];
  }
  const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
  const R = Math.max(x1 - x0, z1 - z0) / 2 + 230;
  /* the VISTA WANTS DISTANCE, not scale — romp 3 learned this the hard way
     ("at 34 m they towered over the rooftop and ate the frame").  54 m was
     still far too close: a 100 m tower that near reads as a wall two lanes
     over, and the rooftop run stopped feeling like a rooftop. */
  const clear2 = 120 * 120;
  let placed = 0;
  for (let n = 0; n < 900 && placed < 38; n++) {
    const a = rnd() * TAU, rr = 110 + rnd() * R;
    const bx = cx + Math.cos(a) * rr, bz = cz + Math.sin(a) * rr;
    let ok = true;
    for (let i = 0; i < path.length; i++) {
      const dx = path[i][0] - bx, dz = path[i][1] - bz;
      if (dx * dx + dz * dz < clear2) { ok = false; break; }
    }
    if (!ok) continue;
    placed++;
    const w = 16 + rnd() * 26, d = 16 + rnd() * 24, h = 24 + rnd() * 86;
    const body = [pal.dayCity1, pal.dayCity2, pal.dayCity3][placed % 3];
    boxMD(md, bx, h / 2, bz, w, h, d, body);
    /* four glass ribbons, so a tower reads the same from every heading */
    for (let yy = 5; yy < h - 4; yy += Math.max(7, h / 7)) {
      boxMD(md, bx, yy, bz, w + 0.6, 2.4, d + 0.6, pal.dayWin);
    }
    if (h > 62) {
      boxMD(md, bx, h + 3.0, bz, 1.2, 6.0, 1.2, pal.dayCity3);
      boxMD(md, bx, h + 6.4, bz, 0.9, 0.9, 0.9, 0xff6a4a);
    }
  }
  /* the pale haze band at the horizon, so the city does not end on a hard cut */
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * TAU, a2 = (i + 1) / 40 * TAU, r = R + 90;
    const p0 = [cx + Math.cos(a) * r, cz + Math.sin(a) * r];
    const p1 = [cx + Math.cos(a2) * r, cz + Math.sin(a2) * r];
    pushTriRaw(md, p0[0], -18, p0[1], p1[0], -18, p1[1], p1[0], 22, p1[1], pal.haze);
    pushTriRaw(md, p0[0], -18, p0[1], p1[0], 22, p1[1], p0[0], 22, p0[1], pal.haze);
  }
}

/* the far daylight backdrop for L1/L2 — soft hills / neighbour houses */
function buildFarDay(pal, z0, z1, kind) {
  const md = _farMD;
  const rnd = mkRnd(4242);
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 16; i++) {
      const bx = side * (30 + rnd() * 64);
      const bz = z0 + rnd() * (z1 - z0);
      if (kind === 'hill') {
        domeMD(md, bx, -2, bz, 14 + rnd() * 20, 7 + rnd() * 10, 8, 2, rgb(pal.hill));
      } else {
        const w = 9 + rnd() * 9, h = 6 + rnd() * 5, d = 9 + rnd() * 8;
        boxMD(md, bx, h / 2, bz, w, h, d, rgb(pal.farHouse));
        for (let k = 0; k < 6; k++) {
          const a0 = [bx - w / 2, h, bz - d / 2], a1 = [bx + w / 2, h, bz - d / 2];
          pushTriRaw(md, a0[0], a0[1], a0[2], a1[0], a1[1], a1[2], bx, h + 3.2, bz, rgb(pal.farRoof));
          break;
        }
        domeMD(md, bx + (rnd() - 0.5) * 12, 0, bz + 6, 5 + rnd() * 3, 8 + rnd() * 4, 7, 2, rgb(pal.farTree));
      }
    }
  }
}
