/* the authoring helper — every call appends one chunk record */
function A() {
  const C = [];
  return {
    C,
    floor(z0, z1, y, w, xc, pat) { C.push({ t: 'floor', z0, z1, y, w, xc: xc || 0, pat: pat || 0 }); return this; },

    walls(z0, z1, hw, h, style) { C.push({ t: 'walls', z0, z1, hw, h, style }); return this; },
    p(k, x, z, a, b, c) { C.push({ t: 'prop', k, x, z, a, b, c }); return this; },
    /* props that need a real y (or a colour) get their own named op rather
       than being squeezed through p()'s positional a/b/c */
    win(x, y, z, w, h) { C.push({ t: 'win', x, y, z, w, h }); return this; },
    neon(x, y, z, w, h, hex) { C.push({ t: 'neon', x, y, z, w, h, hex }); return this; },
    awn(x, y, z, w, d, hex) { C.push({ t: 'awn', x, y, z, w, d, hex }); return this; },
    ac(x, y, z) { C.push({ t: 'ac', x, y, z }); return this; },
    ant(x, y, z) { C.push({ t: 'ant', x, y, z }); return this; },

    box(x, y, z, sx, sy, sz, col, kind) { C.push({ t: 'box', x, y, z, sx, sy, sz, col, kind }); return this; },
    crate(x, y, z, s) { C.push({ t: 'crate', x, y, z, s: s || 0.62 }); return this; },

    mover(x, y, z, sx, sy, sz, ax, amp, per, col, look) { C.push({ t: 'mover', x, y, z, sx, sy, sz, ax, amp, per, col, look }); return this; },

/* ═══════════════════ the build driver ══════════════════════════════════
   Walks the chunk data once, emits geometry into per-band MDs, then merges
   each band into ONE lit mesh.  The bake time is measured and reported
   through __zoomies.perf so the Pi run can confirm it hides behind the
   level-intro card (design §8 LAW).                                     */
let BOSS_SPEC = null;

function emitFloor(o, pal) {
  const hw = o.w / 2, xc = o.xc || 0;
  if (o.pat) {
    /* a TILED floor (romp 4's market): square tiles in a checker, which is
       what a supermarket floor actually is — and inside a corner the rows
       bend with the aisle because every vertex goes through trackToWorld. */
    const tw = o.pat === 'ice' ? 2.05 : 1.63;
    const nx = Math.max(1, Math.round(o.w / tw)), sx = o.w / nx;
    const nz = Math.max(1, Math.round((o.z1 - o.z0) / tw)), sz = (o.z1 - o.z0) / nz;
    const cA = o.pat === 'ice' ? pal.ice : pal.floorA;
    const cB = o.pat === 'ice' ? pal.iceD : pal.floorB;
    for (let i = 0; i < nx; i++) {
      const x0 = xc - hw + i * sx;
      for (let j = 0; j < nz; j++) {
        const z0 = o.z0 + j * sz;
        const r = _rnd();
        /* edge to edge, ONE plane: a grout line at a different height is a
           depth-precision flicker waiting to happen 100 m down the aisle */
        const c = ((i + j) & 1) ? cB : (r < 0.16 ? pal.floorC : cA);
        FLOORQ(x0, z0, x0 + sx, z0 + sz, o.y, c);
      }
    }
  } else {
  const strip = 0.62;
  const n = Math.max(1, Math.round(o.w / strip));
  const segZ = 3.4;
  for (let i = 0; i < n; i++) {
    const x0 = xc - hw + i * o.w / n, x1 = xc - hw + (i + 1) * o.w / n;
    for (let z = o.z0; z < o.z1; z += segZ) {
      const z1 = Math.min(o.z1, z + segZ);
      const r = _rnd();
      const c = r < 0.34 ? pal.floorA : r < 0.67 ? pal.floorB : pal.floorC;
      FLOORQ(x0, z, x1, z1, o.y, c);
    }
  }
  }
  /* The cut EDGE is what makes a gap read as a gap.  Without a skirt the
     hole in the floor just shows the pale void plane and a kid walks
     straight into it — so every slab gets a 1.2 m dark fascia all round. */
  const sk = 1.2, yb = o.y - sk, ec = pal.floorB;
  const md = bandMD((o.z0 + o.z1) / 2);
  for (const zz of [o.z0, o.z1]) {
    const f = zz === o.z0 ? -1 : 1;
    pushTri(md, xc - hw, o.y, zz, xc + hw, o.y, zz, xc + hw, yb, zz, ec);
    pushTri(md, xc - hw, o.y, zz, xc + hw, yb, zz, xc - hw, yb, zz, ec);
    void f;
  }
  /* the long side fascia: ONE quad per side is a straight chord, which on a
     turning level cuts clean through the inside of the bend.  Subdivide it
     (only when the level actually turns) so it follows the arc. */
  const step = TW.on ? 2.0 : (o.z1 - o.z0);
  for (const xx of [xc - hw, xc + hw]) {
    const mdz = bandMD((o.z0 + o.z1) / 2);
    for (let z = o.z0; z < o.z1 - 0.001; z += step) {
      const z1 = Math.min(o.z1, z + step);
      pushTri(mdz, xx, o.y, z, xx, o.y, z1, xx, yb, z1, ec);
      pushTri(mdz, xx, o.y, z, xx, yb, z1, xx, yb, z, ec);
    }

     off the side is a real fall (checkpoint respawn, one heart) */
  S(xc, o.y - 1.0, (o.z0 + o.z1) / 2, o.w, 2.0, o.z1 - o.z0, 'floor');

function emitWalls(o, pal) {
  if (o.style === 'open' || o.style === 'roof' || o.hw <= 0) return;
  /* on a turning level the wall is emitted in SHORTER chunks so the bend
     reads as a bend instead of as four flat panels (each chunk is a box,
     and a box is mapped corner by corner) */
  const wstep = TW.on ? 2 : 4;

           one room over (§emitWalls, romp 4).

           which put 47k tris in view at z=0 in a 16 m room.  One full-height

        for (let yy = 1.2; yy < o.h - 0.5; yy += 3.2)

      } else {
        G(x, o.h / 2, (z + z1) / 2, 0.7, o.h, z1 - z, pal.wall);
        G(x - s * 0.34, 0.46, (z + z1) / 2, 0.06, 0.92, z1 - z, pal.wallLow);
        G(x - s * 0.34, 0.95, (z + z1) / 2, 0.13, 0.12, z1 - z, pal.trim);

      } else if (o.style === 'glass') {
        /* the roof: bright emissive panes between dark ribs, so the room is lit
           from above by the sky it is made of */
        GE(0, o.h + 0.16, (z + z1) / 2, o.hw * 2 + 0.9, 0.10, (z1 - z) - 0.5, pal.glass);
        G(0, o.h + 0.30, (z + z1) / 2, o.hw * 2 + 1.4, 0.20, 0.30, pal.glassFrame);
        G(0, o.h + 0.34, (z + z1) / 2, 0.30, 0.28, z1 - z, pal.glassFrame);
        for (const sx of [-0.55, 0.55])
          G(sx * o.hw, o.h + 0.28, (z + z1) / 2, 0.22, 0.20, z1 - z, pal.glassFrame);
      } else {
        G(0, o.h + 0.18, (z + z1) / 2, o.hw * 2 + 1.4, 0.36, z1 - z, pal.trim);

}
function dispatchChunk(o, pal, L) {
  switch (o.t) {
    case 'floor': emitFloor(o, pal); break;
    case 'walls': emitWalls(o, pal); break;
    case 'corr': WORLD.corridor.push({ z0: o.z0, z1: o.z1, hw: o.hw }); break;
    case 'box': B(o.x, o.y, o.z, o.sx, o.sy, o.sz, o.col, 0, o.kind || 'solid'); break;
    case 'crate': propCrate(o.x, o.y, o.z, o.s, pal); break;
    case 'mover': {
      let m, g2 = null;
      if (o.look === 'yarn') {
        /* a rolling YARN PLANET (romp 7).  The collision box is still a box —
           the sim never learns about spheres — but the MESH is a ball inside a
           carrier group, so updateMovers can position the carrier (and yaw it
           to the route) while the ball rolls inside it. */
        const r = Math.min(o.sx, o.sz) * 0.5;
        m = new THREE.Group();
        g2 = mkYarnBall(r, pal);
        g2.position.y = -o.sy / 2 + r * 0.02;
        m.add(g2);
        if (LOOK && FX.shadow) g2.castShadow = true;
      } else {
        m = vcMesh([vcBox(o.sx, o.sy, o.sz, o.col)]);
      }
      twFace(m, o.x, o.y, o.z, 0);
      scene.add(m);
      const sol = { x0: 0, x1: 0, y0: 0, y1: 0, z0: 0, z1: 0, kind: 'floor', on: true,
        cx: o.x, cy: o.y, cz: o.z, sx: o.sx, sy: o.sy, sz: o.sz,
        mover: true, ax: o.ax, amp: o.amp, per: o.per, bx: o.x, by: o.y, bz: o.z, g: m, vx: 0, vy: 0, vz: 0,
        g2, rollR: Math.min(o.sx, o.sz) * 0.5 };
      WORLD.movers.push(sol);
      break;
    }
    case 'kib': addKibble(o.x, o.y, o.z); break;
    case 'row': for (let i = 0; i < o.n; i++) addKibble(o.x + o.dx * i, o.y + o.dy * i, o.z + o.dz * i); break;
    case 'arc': {
      for (let i = 0; i < o.n; i++) {
        const t = o.n === 1 ? 0.5 : i / (o.n - 1);
        addKibble(o.x + o.tx * t, o.y + Math.sin(t * Math.PI) * o.h, o.z + o.tz * t);
      }
      break;
    }
    case 'treat': addPick(o.k, o.x, o.y, o.z); break;
    case 'mouse': addPick('mouse', o.x, o.y, o.z); break;
    case 'enemy': addEnt(o.k, o.x, o.y, o.z, o.o); break;
    case 'check': {
      /* bins don't exist yet mid-build — read the AUTHORED floors for the
         walk height, or an elevated checkpoint is buried at y=0:
         un-touchable (|CAT.y − y| < 2.4) and a through-the-floor respawn */
      let fy = 0;
      for (let i = 0; i < L.chunks.length; i++) {
        const f = L.chunks[i];
        if (f.t !== 'floor' || o.z < f.z0 || o.z >= f.z1) continue;
        const hw = f.w / 2, xc = f.xc || 0;
        if (o.x >= xc - hw && o.x <= xc + hw && f.y > fy) fy = f.y;
      }
      const g = buildCheckpoint(o.x, fy, o.z);
      WORLD.checkpoints.push({ x: o.x, y: fy, z: o.z, g, hit: false });
      GLOW(o.x, fy + 1.7, o.z, 3.0, 0xffd75e, 0.5);
      break;
    }
    /* ── THE BIG OUTSIDE ── */
    case 'vent': {
      if (o.art === 'sparkle') propSparkleRing(o.x, o.z, o.r, pal, o.y0);
      else propGrate(o.x, o.z, o.r, pal, o.y0);
      WORLD.vents.push({ x: o.x, z: o.z, r: o.r, power: o.power, y0: o.y0, h: o.h });
      break;
    }
    case 'zip': {
      propZipline(o.x0, o.z0, o.y0, o.x1, o.z1, o.y1, pal);
      WORLD.zips.push({ x0: o.x0, z0: o.z0, y0: o.y0, x1: o.x1, z1: o.z1, y1: o.y1,
        sp: o.sp || 0,
        len: Math.hypot(o.x1 - o.x0, o.y1 - o.y0, o.z1 - o.z0) });
      break;
    }
    case 'slick': {
      const hw = o.w / 2;
      const s = addSlick(o.x - hw, o.x + hw, o.z0, o.z1, o.k == null ? 1 : o.k, o.cold);
      /* the visible sheen — one flat translucent quad, no depth write */
      const m = makePuddle(o.w, o.z1 - o.z0, pal.iceGlow);
      m.material.opacity = 0.22;
      twPos(m, o.x, 0.024, (o.z0 + o.z1) / 2);
      m.rotation.y = twYaw((o.z0 + o.z1) / 2, 0);
      s.g = m;
      break;
    }
    case 'shelf2': propShelfUnit(o.x, o.z, o.len, pal); break;
    case 'endcap': propEndCap(o.x, o.z, pal); break;
    case 'freez': propFreezer(o.x, o.z, o.len, pal); break;
    case 'reg': propRegister(o.x, o.z, pal); break;
    case 'conv': propConvRig(o.x, o.z, o.len, o.w, pal); break;
    case 'cart': propCart(o.x, o.z, o.ry, pal); break;
    case 'sign': propSignHang(o.x, o.y, o.z, o.w, o.h, o.hex, pal); break;
    case 'cone': propCone(o.x, o.z, o.ry, pal); break;
    case 'doors': propDoors(o.x, o.z, pal); break;
    case 'pa': WORLD.says.push({ z: o.z, main: o.main, sub: o.sub, said: false }); break;
    /* ── THE BIG OUTSIDE, part two ── */
    case 'leaf': propLeafTramp(o.x, o.y, o.z, o.r, pal); break;
    case 'pots': propPotStack(o.x, o.z, o.n, pal); break;
    case 'stage': propStage(o.x, o.z, o.len, o.w, o.y, pal); break;
    case 'fern': propFern(o.x, o.z, o.s, pal); break;
    case 'palm': propPalm(o.x, o.z, o.h, pal); break;
    case 'ivy': propVine(o.x, o.y, o.z, o.h, pal); break;
    case 'bed': propFlowerBed(o.x, o.z, o.len, o.w, pal); break;
    case 'canopy': propCanopy(o.x, o.y, o.z, o.s, pal); break;
    case 'tower': propTowerBlock(o.x, o.z, o.w, o.d, o.h, pal); break;
    case 'crane': propCrane(o.x, o.z, o.h, pal); break;
    case 'washer': propWasherRig(o.x, o.y, o.z, o.w, pal); break;
    case 'kite': propKite(o.x, o.y, o.z, o.hex, pal); break;
    case 'isle': propCushionIsle(o.x, o.z, o.w, o.d, o.y, pal); break;
    case 'cloud': propCloud(o.x, o.y, o.z, o.s, pal); break;
    case 'column': propThroneColumn(o.x, o.z, o.h, pal); break;
    case 'bossz': BOSS_SPEC = { z: o.z, k: o.k }; break;
    case 'end': WORLD.length = o.z; break;
    case 'win': propWindow(o.x, o.y, o.z, o.w, o.h, pal); break;
    case 'neon': propNeon(o.x, o.y, o.z, o.w, o.h, o.hex, pal); break;
    case 'awn': propAwning(o.x, o.y, o.z, o.w, o.d, o.hex, pal); break;
    case 'ac': propAC(o.x, o.y, o.z, pal); break;
    case 'ant': propAntenna(o.x, o.y, o.z, pal); break;
    case 'line': propClothesline(o.x0, o.z0, o.x1, o.z1, o.y, pal, o.n); break;
    case 'prop': {
      const x = o.x, z = o.z, A1 = o.a, A2 = o.b, A3 = o.c;
      switch (o.k) {
        case 'rug': propRug(x, z, A1, A2, pal); break;
        case 'couch': propCouch(x, z, A1 || 0, pal); break;
        case 'table': propTable(x, z, A1, A2, A3, pal); break;
        case 'shelf': propShelf(x, z, A1 || 0, A2 || 2.2, pal); break;
        case 'counter': propCounter(x, z, A1, pal); break;
        case 'fridge': propFridge(x, z, pal); break;
        case 'lamp': propLamp(x, z, pal); break;
        case 'plant': propPlant(x, z, pal); break;
        case 'doorway': propDoorway(x, z, pal); break;
        case 'cattree': propCatTree(x, z, pal); break;
        case 'fencerun': propFenceRun(x, z, A1, pal); break;
        case 'fencetop': propFenceTop(x, z, A1, A2, pal); break;
        case 'bush': propBush(x, z, A1, pal); break;
        case 'tree': propTree(x, z, A1, pal); break;

function buildLevel(li) {
  const t0 = performance.now();
  clearWorld();
  clearEntities();
  const L = LEVELS[li];
  WORLD.theme = L.theme; WORLD.pal = L.pal;
  WORLD.gravK = L.gravK || 1;
  /* THE CUCUMBER KING's launch ranks live in the LEVEL (the pads are geometry,
     the cucumbers are his) — hand them to the sim before the boss spawns */
  WORLD.kingPads = L.kingPads || null;
  _pal = L.pal;
  applyTheme(L.theme);
  _mds = []; _farMD = MD(); _rnd = mkRnd(L.seed);
  BOSS_SPEC = null;
  /* THE ROUTE (LEVELS2 §A): built BEFORE any geometry, because every vertex
     pushed below is mapped through it.  No `path` → identity → today's game */
  twBuild(L);
  for (let i = 0; i < L.chunks.length; i++) dispatchChunk(L.chunks[i], L.pal, L);
  /* the dark nothing under the corridor: every gap now reads as a HOLE
     instead of as a pale patch of sky (2 unlit tris per band) */
  {
    /* the void is a THEME property now (THEMES[].voidY / .voidCol, already set
       by applyTheme above).  The four shipped themes carry exactly the values
       the old ternary hard-coded, so romps 1–4 are unchanged; romp 6 needs a
       pale city haze down there and romp 7 needs a deep indigo nothing. */
    const vy = THEME.voidY == null ? -7 : THEME.voidY;
    const vc = THEME.voidCol == null ? 0x2b1d14 : THEME.voidCol;
    /* into the FOG-LESS far mesh: fogged, the void washed to the same cream
       as the sky and a hole in the floor read as solid ground.
       A TURNING level takes ONE world-space slab over the whole route: the
       track-space strips would be pushed through the corner pivot and fold
       into a fan (and the void is a flat plane in every level anyway). */
    if (TW.on) {
      const b = twBounds(60);
      twRaw(true);
      pushTriRaw(_farMD, b.x0, vy, b.z0, b.x1, vy, b.z0, b.x1, vy, b.z1, vc);
      pushTriRaw(_farMD, b.x0, vy, b.z0, b.x1, vy, b.z1, b.x0, vy, b.z1, vc);
      twRaw(false);
    } else {
      for (let z = -40; z < L.len + 60; z += BAND) {
        pushTriRaw(_farMD, -40, vy, z, 40, vy, z, 40, vy, z + BAND, vc);
        pushTriRaw(_farMD, -40, vy, z, 40, vy, z + BAND, -40, vy, z + BAND, vc);
      }
    }
  }
  /* the far backdrop — ONE unlit merged mesh, fog:false.  It is authored in
     WORLD space (it reaches ±150 m sideways, well outside any corner pivot),
     so it goes up inside twRaw.  `far:'none'` is an interior: no backdrop. */
  if (L.far !== 'none') {
    twRaw(TW.on);
    if (L.far === 'city') buildSkyline(L.pal, -60, L.len + 70);
    /* romp 6's DAY skyline is route-aware (it has to be: the level turns) */
    else if (L.far === 'cityday') buildSkylineDay(L.pal, L.len);
    else buildFarDay(L.pal, -60, L.len + 70, L.far === 'hill' ? 'hill' : 'house');
    twRaw(false);
  }

  for (let i = 0; i < _mds.length; i++) {
    if (!_mds[i].p.length) continue;
    const tris = mdTris(_mds[i]);
    const m = mdMesh(_mds[i]);
    scene.add(m);
    WORLD.bands.push({ z0: i * BAND, z1: (i + 1) * BAND, mesh: m, tris });
    WORLD.tris += tris;
  }
  WORLD.far = mdMesh(_farMD, MAT_FAR);
  WORLD.far.frustumCulled = false;
  scene.add(WORLD.far);
  WORLD.tris += mdTris(_farMD);
  _mds = null; _farMD = null;

  buildBins();
  buildKibbleMesh(KIBS.length + 90);
  if (BOSS_SPEC) spawnBoss(BOSS_SPEC.k, BOSS_SPEC.z);
  WORLD.bakeMs = performance.now() - t0;
  return WORLD.bakeMs;
}

/* z-bucketed collision broadphase: the cat only ever tests two buckets */
function buildBins() {
  const nb = Math.ceil((WORLD.length + 90) / BINZ) + 4;
  WORLD.bins.length = 0;
  for (let i = 0; i < nb; i++) WORLD.bins.push(null);
  for (let i = 0; i < WORLD.solids.length; i++) {
    const s = WORLD.solids[i];
    const b0 = Math.max(0, Math.floor((s.z0 + 40) / BINZ));
    const b1 = Math.min(nb - 1, Math.floor((s.z1 + 40) / BINZ));
    for (let b = b0; b <= b1; b++) {
      if (!WORLD.bins[b]) WORLD.bins[b] = [];
      WORLD.bins[b].push(s);
    }
  }
}
function binAt(z) {
  const i = Math.floor((z + 40) / BINZ);
  return (i >= 0 && i < WORLD.bins.length) ? WORLD.bins[i] : null;
}
